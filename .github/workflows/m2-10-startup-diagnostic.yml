name: M2-10 First Startup Diagnostic

on:
  push:
    branches:
      - fix/m2-10-runtime-startup-performance
    paths:
      - .github/workflows/m2-10-startup-diagnostic.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: m2-10-first-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: API 36 x86_64 first diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Enforce first run, first attempt, and resolve numeric job identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_WORKFLOW_NAME: M2-10 First Startup Diagnostic
          EXPECTED_JOB_NAME: API 36 x86_64 first diagnostic
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/fix/m2-10-runtime-startup-performance
          test "$GITHUB_RUN_ATTEMPT" = 1
          runs="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/runs?branch=fix%2Fm2-10-runtime-startup-performance&event=push&per_page=100")"
          api_total_count="$(jq -r '.total_count' <<<"$runs")"
          [[ "$api_total_count" =~ ^[0-9]+$ ]]
          test "$api_total_count" -lt 100
          total_count="$(jq --arg name "$EXPECTED_WORKFLOW_NAME" \
            '[.workflow_runs[] | select(.name == $name)] | length' <<<"$runs")"
          exact_count="$(jq --arg name "$EXPECTED_WORKFLOW_NAME" --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .event == "push")] | length' <<<"$runs")"
          current_count="$(jq --arg name "$EXPECTED_WORKFLOW_NAME" --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .event == "push" and (.id | tostring) == $run_id)] | length' <<<"$runs")"
          test "$total_count" = 1
          test "$exact_count" = 1
          test "$current_count" = 1
          jobs="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100")"
          job_id="$(jq -r --arg name "$EXPECTED_JOB_NAME" \
            '[.jobs[] | select(.name == $name) | .id] | if length == 1 then .[0] else empty end' \
            <<<"$jobs")"
          [[ "$job_id" =~ ^[1-9][0-9]*$ ]]
          printf 'M210_JOB_ID=%s\n' "$job_id" >> "$GITHUB_ENV"

      - name: Verify pinned Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          test "${ImageOS:-}" = ubuntu24
          case "${ImageVersion:-}" in
            20260720.247.2) reviewed_manifest='ubuntu24/20260720.247' ;;
            20260804.265.1) reviewed_manifest='ubuntu24/20260804.265' ;;
            20260810.271.1) reviewed_manifest='ubuntu24/20260810.271' ;;
            *) printf 'unexpected mutable runner image: ImageOS=%s ImageVersion=%s\n' \
                 "${ImageOS:-}" "${ImageVersion:-}" >&2; exit 1 ;;
          esac
          test "$(gcc -dumpfullversion -dumpversion)" = 13.3.0
          test "$(g++ -dumpfullversion -dumpversion)" = 13.3.0
          printf 'runner_manifest_ref=%s\n' "$reviewed_manifest"

      - name: Set up Temurin JDK
        # actions/setup-java v5
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false

      - name: Prepare pinned API 36 revision 2 emulator
        shell: bash
        run: |
          set -euo pipefail
          manifest='tools/validation/m0-05-linux-kvm-packages.json'
          sdk_root="$GITHUB_WORKSPACE/.toolchains/android-m2-10-ci"
          downloads="$sdk_root/downloads"
          mkdir -p "$downloads" "$sdk_root/system-images/android-36/default" build/m2-10

          pulse_package="$(jq -r '.host_packages[0].package' "$manifest")"
          pulse_version="$(jq -r '.host_packages[0].version' "$manifest")"
          test "$pulse_package" = libpulse0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$pulse_package=$pulse_version"
          test "$(dpkg-query -W -f='${Version}' "$pulse_package")" = "$pulse_version"

          for directory in cmdline-tools licenses platform-tools; do
            test -e "$ANDROID_HOME/$directory"
            ln -s "$ANDROID_HOME/$directory" "$sdk_root/$directory"
          done
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            'platforms;android-36' 'build-tools;36.1.0' \
            'ndk;29.0.14206865' 'cmake;4.1.2'

          emulator_url="$(jq -r '.packages[0].archive_url' "$manifest")"
          emulator_name="$(jq -r '.packages[0].archive' "$manifest")"
          emulator_sha="$(jq -r '.packages[0].sha256' "$manifest")"
          emulator_bytes="$(jq -r '.packages[0].bytes' "$manifest")"
          image_url="$(jq -r '.packages[2].archive_url' "$manifest")"
          image_name="$(jq -r '.packages[2].archive' "$manifest")"
          image_sha="$(jq -r '.packages[2].sha256' "$manifest")"
          image_bytes="$(jq -r '.packages[2].bytes' "$manifest")"
          curl --fail --location --retry 3 --output "$downloads/$emulator_name" "$emulator_url"
          curl --fail --location --retry 3 --output "$downloads/$image_name" "$image_url"
          test "$(stat -c %s "$downloads/$emulator_name")" = "$emulator_bytes"
          test "$(stat -c %s "$downloads/$image_name")" = "$image_bytes"
          echo "$emulator_sha  $downloads/$emulator_name" | sha256sum --check --strict
          echo "$image_sha  $downloads/$image_name" | sha256sum --check --strict
          unzip -q "$downloads/$emulator_name" -d "$sdk_root"
          unzip -q "$downloads/$image_name" -d "$sdk_root/system-images/android-36/default"
          image_dir="$sdk_root/system-images/android-36/default/x86_64"
          grep -Fx 'Pkg.Revision=2' "$image_dir/source.properties"
          grep -Fx 'AndroidVersion.ApiLevel=36' "$image_dir/source.properties"
          grep -Fx 'SystemImage.Abi=x86_64' "$image_dir/source.properties"
          "$sdk_root/emulator/emulator" -version > build/m2-10/emulator-version.txt
          grep -F 'Android emulator version 37.1.11' build/m2-10/emulator-version.txt
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$sdk_root/avd" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"

      - name: Prepare verified M2-07 Native crypto source
        shell: bash
        run: |
          set -euo pipefail
          archive='.toolchains/native-crypto/downloads/mbedtls-4.1.1.tar.bz2'
          source_parent='.toolchains/native-crypto/src'
          source_root="$source_parent/mbedtls-4.1.1"
          extract_root="$source_parent/.mbedtls-4.1.1.extract"
          cleanup_source() {
            rm -rf -- "$extract_root" "$source_root"
            rm -f -- "$archive"
          }
          trap cleanup_source ERR
          mkdir -p "$(dirname "$archive")" "$source_parent"
          curl --fail --location --retry 3 --output "$archive" \
            'https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-4.1.1/mbedtls-4.1.1.tar.bz2'
          node tools/validation/verify-m2-07-native-crypto.mjs --archive-only
          while IFS= read -r member; do
            case "$member" in mbedtls-4.1.1/*) ;; *) exit 1 ;; esac
            case "/$member/" in */../*) exit 1 ;; esac
          done < <(tar -tjf "$archive")
          rm -rf -- "$extract_root" "$source_root"
          mkdir "$extract_root"
          tar -xjf "$archive" -C "$extract_root"
          node tools/validation/verify-m2-07-native-crypto.mjs --self-test --pre-promote \
            --source-root="$extract_root/mbedtls-4.1.1"
          printf '%s\n' \
            'archive_sha256=3359a349e23db3d5536fcee032ae7b2ecbfc08972fab643089b5cbf2a375c98c' \
            'source_tree_sha256=7c4ba6554fed6eb67c201054bc75b124fcdc0649e2f56cd762746e01a25d2140' \
            > "$extract_root/mbedtls-4.1.1/.aah-m2-07-verified"
          mv "$extract_root/mbedtls-4.1.1" "$source_root"
          rmdir "$extract_root"
          node tools/validation/verify-m2-07-native-crypto.mjs --self-test
          trap - ERR

      - name: Build isolated profile target and instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          signer_root="$RUNNER_TEMP/m2-10-signing"
          mkdir -p "$signer_root" build/m2-10/inputs
          password="$(openssl rand -hex 24)"
          keystore="$signer_root/fixture.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore" \
            -storepass "$password" -keypass "$password" -alias fixture \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname 'CN=M2-10 Synthetic Fixture,O=androidAppHardening,C=XX'
          export M005_TEST_KEYSTORE="$keystore"
          export M005_TEST_STORE_PASSWORD="$password"
          export M005_TEST_KEY_ALIAS=fixture
          export M005_TEST_KEY_PASSWORD="$password"
          timeout 1800s ./gradlew --no-daemon --console=plain \
            :runtime:policy:assembleRelease \
            :runtime:bootstrap:assembleRelease \
            :integration-tests:generateM210RuntimeBundle \
            :fixtures:android:assembleFixtures \
            :fixtures:android:assembleM210JavaSingleProfileDebugAndroidTest
          node tools/validation/verify-m2-10-runtime-startup-performance.mjs self-test
          node tools/validation/verify-m2-10-runtime-startup-performance.mjs surface \
            --root . \
            --profile-policy-aar runtime/policy/build/outputs/aar/policy-m210Profile.aar \
            --profile-bootstrap-aar runtime/bootstrap/build/outputs/aar/bootstrap-m210Profile.aar \
            --release-policy-aar runtime/policy/build/outputs/aar/policy-release.aar \
            --release-bootstrap-aar runtime/bootstrap/build/outputs/aar/bootstrap-release.aar \
            --scratch build/m2-10/surface

          mapfile -t test_candidates < <(find \
            fixtures/android/build/outputs/apk/androidTest/m210JavaSingleProfile/debug \
            -maxdepth 1 -type f -name '*.apk' -print)
          test "${#test_candidates[@]}" = 1
          test_apk="${test_candidates[0]}"
          fixture='fixtures/android/build/fixtures/java-single-dex.apk'
          test -f "$fixture"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias fixture \
            --ks-pass "pass:$password" --key-pass "pass:$password" \
            --out build/m2-10/inputs/baseline.apk "$fixture"
          mkdir -p integration-tests/build/m2-10/profile
          timeout 300s ./gradlew --no-daemon --console=plain \
            -Pm210InputApk=build/m2-10/inputs/baseline.apk \
            :integration-tests:runM210ProfileProtect
          unsigned='integration-tests/build/m2-10/profile/protected-unsigned.apk'
          profiling='build/m2-10/inputs/profiling.apk'
          test -f "$unsigned"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias fixture \
            --ks-pass "pass:$password" --key-pass "pass:$password" \
            --out "$profiling" "$unsigned"
          cp "$test_apk" build/m2-10/inputs/profile-test.apk
          signer_digest() {
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$1" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          }
          baseline_signer="$(signer_digest build/m2-10/inputs/baseline.apk)"
          profiling_signer="$(signer_digest "$profiling")"
          test_signer="$(signer_digest build/m2-10/inputs/profile-test.apk)"
          test -n "$baseline_signer"
          test "$baseline_signer" = "$profiling_signer"
          test "$baseline_signer" = "$test_signer"
          unset password M005_TEST_STORE_PASSWORD M005_TEST_KEY_PASSWORD

      - name: Run the first and only bounded diagnostic
        shell: bash
        run: |
          set -euo pipefail
          avd_name='m2_10_api36_r2_x86_64'
          serial='emulator-5554'
          emulator_pid=''
          cleanup() {
            set +e
            adb -s "$serial" uninstall ah.fixtures.android.m301.java_single.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m301.java_single >/dev/null 2>&1
            adb -s "$serial" emu kill >/dev/null 2>&1
            if [[ -n "$emulator_pid" ]]; then
              kill -TERM "$emulator_pid" >/dev/null 2>&1
              timeout 10s tail --pid="$emulator_pid" -f /dev/null >/dev/null 2>&1
              kill -KILL "$emulator_pid" >/dev/null 2>&1
            fi
            pkill -TERM -f "$ANDROID_HOME/emulator/qemu/" >/dev/null 2>&1
            sleep 1
            pkill -KILL -f "$ANDROID_HOME/emulator/qemu/" >/dev/null 2>&1
            rm -rf -- "$RUNNER_TEMP/m2-10-signing"
          }
          trap cleanup EXIT INT TERM
          avd_dir="$ANDROID_AVD_HOME/$avd_name.avd"
          mkdir -p "$avd_dir" build/m2-10/emulator
          printf '%s\n' \
            'avd.ini.encoding=UTF-8' "path=$avd_dir" 'target=android-36' \
            > "$ANDROID_AVD_HOME/$avd_name.ini"
          printf '%s\n' \
            'PlayStore.enabled=no' 'abi.type=x86_64' "avd.id=$avd_name" \
            'avd.ini.encoding=UTF-8' "avd.name=$avd_name" \
            'disk.dataPartition.size=2147483648' 'fastboot.forceColdBoot=yes' \
            'fastboot.forceFastBoot=no' 'hw.cpu.arch=x86_64' 'hw.cpu.ncore=2' \
            'hw.device.name=pixel_2' 'hw.gpu.enabled=yes' 'hw.keyboard=yes' \
            'hw.lcd.density=420' 'hw.lcd.height=1920' 'hw.lcd.width=1080' \
            'hw.ramSize=2048' 'image.sysdir.1=system-images/android-36/default/x86_64/' \
            'runtime.network.latency=none' 'runtime.network.speed=full' 'tag.id=default' \
            > "$avd_dir/config.ini"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" \
            -avd "$avd_name" -port 5554 -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on -no-metrics \
            > build/m2-10/emulator/stdout.txt 2> build/m2-10/emulator/stderr.txt &
          emulator_pid=$!
          timeout 180s adb -s "$serial" wait-for-device
          timeout 180s bash -c \
            'until [[ "$(adb -s "$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]]; do sleep 2; done' \
            _ "$serial"
          adb -s "$serial" shell input keyevent 82
          ANDROID_SERIAL="$serial" timeout 900s node \
            tools/validation/run-m2-10-startup-diagnostic.mjs \
            --artifact-root build/m2-10/diagnostic \
            --head-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --job-id "$M210_JOB_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment-id api36-x86_64-r2-emulator-37.1.11 \
            --baseline-apk build/m2-10/inputs/baseline.apk \
            --profiling-apk build/m2-10/inputs/profiling.apk \
            --test-apk build/m2-10/inputs/profile-test.apk \
            --target-package ah.fixtures.android.m301.java_single \
            --test-package ah.fixtures.android.m301.java_single.test \
            --runner ah.runtime.profile.M210StartupProfileRunner

      - name: Upload immutable diagnostic evidence
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-10-first-startup-diagnostic
          path: build/m2-10/diagnostic
          if-no-files-found: error
          retention-days: 14
