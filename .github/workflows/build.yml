      - name: Verify four Native ABIs
        shell: pwsh
        run: |
          $toolRoot = "$env:ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/windows-x86_64/bin"
          foreach ($abi in @("armeabi-v7a", "arm64-v8a", "x86", "x86_64")) {
            $file = "runtime/native/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/$abi/libah_runtime.so"
            if (-not (Test-Path -LiteralPath $file)) { throw "missing $file" }
            if ((Get-Item -LiteralPath $file).Length -le 100000) { throw "crypto backend was not retained in $file" }
            $dynamic = & "$toolRoot/llvm-readelf.exe" -h -d $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $dynamic
            $dynamicText = $dynamic -join "`n"
            if ($dynamicText -notmatch "BIND_NOW") { throw "missing BIND_NOW in $file" }
            if ($dynamicText -match "libcrypto|libssl|mbedtls|mbedx509") {
              throw "unexpected dynamic crypto/TLS dependency in $file"
            }
            $exports = & "$toolRoot/llvm-nm.exe" -D --defined-only $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($exports -match "(^| )psa_|(^| )mbedtls_") {
              throw "unexpected exported upstream crypto symbol in $file"
            }
            $unstripped = Get-ChildItem -Recurse -Filter libah_runtime.so `
              "runtime/native/build/intermediates/cxx/RelWithDebInfo" | `
              Where-Object { $_.FullName -match "[\\/]obj[\\/]$([regex]::Escape($abi))[\\/]libah_runtime\.so$" } | `
              Select-Object -First 1
            if ($null -eq $unstripped) { throw "missing unstripped Release $abi ELF" }
            $symbols = & "$toolRoot/llvm-nm.exe" -C --defined-only $unstripped.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $symbolsText = $symbols -join "`n"
            foreach ($required in @("aes256GcmDecrypt", "hkdfSha256", "secureZero", "ah_crypto_backend_anchor")) {
              if ($symbolsText -notmatch [regex]::Escape($required)) { throw "missing $required in $($unstripped.FullName)" }
            }
            if ($symbolsText -match "(?im)(^|[_: ])(rsa|ecc|ecdsa|ecdh|chacha|ccm|cbc|x509|ssl|pkcs)([_: (]|$)") {
              throw "unexpected out-of-scope crypto symbol in $($unstripped.FullName)"
            }
            Get-FileHash -Algorithm SHA256 -LiteralPath $file, $unstripped.FullName
          }
