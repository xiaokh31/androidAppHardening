name: Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Check out repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false

      - name: Verify Node.js version
        shell: bash
        run: node -e "if (process.version !== 'v24.12.0') process.exit(1)"

      - name: Check governance script syntax
        shell: bash
        run: |
          node --check tools/governance/validate-project-package.mjs
          node --check tools/governance/hash-project-package.mjs
          node --check tools/governance/test-handoff-validator.mjs
          node --check tools/governance/verify-m3-07-high-benchmark-contract.mjs
          node --check tools/governance/verify-m3-08-startup-stability-contract.mjs
          node --check tools/governance/verify-m3-09-startup-attribution-contract.mjs
          node --check tools/governance/verify-m3-11-canonical-artifact-contract.mjs
          node --check tools/governance/verify-m3-13-diagnostic-identity-contract.mjs
          node --check .agents/skills/coordinate-project-handoff/scripts/validate-handoff.mjs

      - name: Validate project package
        shell: bash
        run: |
          node tools/governance/validate-project-package.mjs
          node tools/governance/verify-m3-07-high-benchmark-contract.mjs
          node tools/governance/verify-m3-07-high-benchmark-contract.mjs --self-test
          node tools/governance/verify-m3-08-startup-stability-contract.mjs
          node tools/governance/verify-m3-08-startup-stability-contract.mjs --self-test
          node tools/governance/verify-m3-09-startup-attribution-contract.mjs
          node tools/governance/verify-m3-09-startup-attribution-contract.mjs --self-test
          node tools/governance/verify-m3-11-canonical-artifact-contract.mjs
          node tools/governance/verify-m3-11-canonical-artifact-contract.mjs --self-test
          node tools/governance/verify-m3-13-diagnostic-identity-contract.mjs
          node tools/governance/verify-m3-13-diagnostic-identity-contract.mjs --self-test

      - name: Enforce M3-07 zero production diff
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/m3-07-high-benchmark-contract'
        shell: bash
        env:
          M307_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/governance/verify-m3-07-high-benchmark-contract.mjs --base-ref "$M307_BASE_SHA"

      - name: Enforce M3-08 zero implementation diff
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/m3-08-startup-performance-stability'
        shell: bash
        env:
          M308_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/governance/verify-m3-08-startup-stability-contract.mjs --base-ref "$M308_BASE_SHA"

      - name: Enforce M3-09 zero implementation diff
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/m3-09-startup-attribution-boundary'
        shell: bash
        env:
          M309_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/governance/verify-m3-09-startup-attribution-contract.mjs --base-ref "$M309_BASE_SHA"

      - name: Enforce M3-11 zero implementation diff
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/m3-11-canonical-startup-artifacts'
        shell: bash
        env:
          M311_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/governance/verify-m3-11-canonical-artifact-contract.mjs --base-ref "$M311_BASE_SHA"

      - name: Enforce M3-13 zero implementation diff
        if: github.event_name == 'pull_request' && github.head_ref == 'docs/m3-13-diagnostic-identity-contract'
        shell: bash
        env:
          M313_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/governance/verify-m3-13-diagnostic-identity-contract.mjs --base-ref "$M313_BASE_SHA"

      - name: Validate HandOff on pull request
        if: github.event_name == 'pull_request'
        shell: bash
        run: node .agents/skills/coordinate-project-handoff/scripts/validate-handoff.mjs HandOff.md --strict --allow-pending-branch

      - name: Validate HandOff on main
        if: github.event_name == 'push'
        shell: bash
        run: node .agents/skills/coordinate-project-handoff/scripts/validate-handoff.mjs HandOff.md --strict

      - name: Run HandOff negative tests
        shell: bash
        run: node tools/governance/test-handoff-validator.mjs

      - name: Verify Git object database
        shell: bash
        run: git fsck --full --strict
