name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Build (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK
        # actions/setup-java v5
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false

      - name: Cache verified Gradle inputs
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*gradle.lockfile', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.jar', 'gradle/libs.versions.toml') }}

      - name: Install pinned Android packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;4.1.2"

      - name: Verify pinned entry points
        shell: bash
        run: |
          test "$(node --version)" = "v24.12.0"
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/.*java.version = //p')" = "17.0.19"
          ./gradlew --no-daemon --version

      - name: Run full Linux checks
        shell: bash
        run: >-
          ./gradlew --no-daemon clean check lint verifyGovernance :runtime:native:assemble
          -Paapt2Executable="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          -Paapt2AndroidJar="$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Verify M1-01 byte-identical reports
        shell: bash
        run: |
          canonical="host/apk-inspector/build/reports/m1-01/canonical-model.json"
          errors="host/apk-inspector/build/reports/m1-01/error-matrix.json"
          test "$(sha256sum "$canonical" | awk '{print $1}')" = "c15561ee6d6e879ad9db058be2762282538a77d4204279d6b5d6d57b1f1d52bf"
          test "$(sha256sum "$errors" | awk '{print $1}')" = "b396616ff369fa2d4db56c92f6908253339867d71554f96debee4d7ed06a02fc"
          sha256sum "$canonical" "$errors"

      - name: Verify M1-02 byte-identical signer reports
        shell: bash
        run: |
          policy="host/apk-inspector/build/reports/m1-02/canonical-policy.json"
          errors="host/apk-inspector/build/reports/m1-02/error-matrix.json"
          test "$(sha256sum "$policy" | awk '{print $1}')" = "b945ede114fd87771631b862c5f7a22120bc5aac2db6bbc836cfb608a54f52a2"
          test "$(sha256sum "$errors" | awk '{print $1}')" = "c33d342077c371878399c80e76ae025cd0efc56bfcca6d5bf80ffde4d75677c6"
          sha256sum "$policy" "$errors"

      - name: Verify M1-03 byte-identical AXML reports
        shell: bash
        run: |
          transforms="host/axml/build/reports/m1-03/transform-matrix.json"
          errors="host/axml/build/reports/m1-03/error-matrix.json"
          fuzz="host/axml/build/reports/m1-03/fuzz-summary.json"
          aapt2="host/axml/build/reports/m1-03/aapt2-cross-check.json"
          test "$(sha256sum "$transforms" | awk '{print $1}')" = "35bd420aa0fe05e1a5efee197bdea8d3699f5de743bf54974f13833e24ef5635"
          test "$(sha256sum "$errors" | awk '{print $1}')" = "9a60c0c9fe710798d7f458822c1f2d6ffb9a22527a43c176c6c3869fb6dcf49c"
          test "$(sha256sum "$fuzz" | awk '{print $1}')" = "d1dbf919a489a067506ab40b629916ea66a5b8a3e3ced42e710ae8dc57f8dced"
          test "$(sha256sum "$aapt2" | awk '{print $1}')" = "916e2d79af152c6090fc7ba0c4b9b24f054f0eb094ff2968192b922d0d593672"
          sha256sum "$transforms" "$errors" "$fuzz" "$aapt2"

      - name: Verify M1-04 byte-identical AHDC v2 container
        shell: bash
        run: |
          node tools/validation/verify-ahdc-v2-vector.mjs
          container="host/container/build/reports/m1-04/work/deterministic-a.ahdc"
          vector="host/container/build/reports/m1-04/cross-language-vector.json"
          consumer="host/container/build/reports/m1-04/cross-language-consumer.json"
          test "$(sha256sum "$container" | awk '{print $1}')" = "3764b908e534ffa5179a9519045ec74a7caa44b30c80447998c593a1ac2fa60d"
          test "$(sha256sum "$vector" | awk '{print $1}')" = "3b2421fcc91234333d13545826b51fbf0de25c5fa26b39aa17d90a9ff2133afc"
          test "$(sha256sum "$consumer" | awk '{print $1}')" = "542ba9db02b643f445fc9194220e7fac6debb28e45089de38403843c78be2b1a"
          sha256sum "$container" "$vector" "$consumer"

      - name: Verify M1-05 byte-identical repacker reports
        shell: bash
        run: |
          declare -A expected=(
            ["host/repacker/build/reports/m1-05/entry-manifest.json"]="606eb0d4a28d2235d054273b749740eaaff2fdf0891d84e582291ff327e2d687"
            ["host/repacker/build/reports/m1-05/error-matrix.json"]="3c5b1283874f101b9007d67c2bdceff002afff0505292f91398401ab4cb2f941"
            ["host/repacker/build/reports/m1-05/alignment-report.json"]="c173698b586d53b61874611cc36930725dd8ce7ea2f737c51b02d5afa7e427bd"
            ["host/repacker/build/reports/m1-05/abi-matrix.json"]="add443496d258e389917d7fabaf1ea7d59b120d7d57b088969bb89976da3f5b8"
            ["host/repacker/build/reports/m1-05/external-tools.json"]="9723e87adedf97b176ea186baf0309159981e0154fedd25f46841d53f0bde29b"
          )
          for file in "${!expected[@]}"; do
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "${expected[$file]}"
            echo "$actual  $file"
          done

      - name: Test dependency verification failure
        shell: bash
        run: node tools/validation/test-dependency-verification.mjs

      - name: Verify four Native ABIs
        shell: bash
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            file="runtime/native/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/$abi/libah_runtime.so"
            test -f "$file"
            "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$file"
          done

  windows:
    name: Build (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK
        # actions/setup-java v5
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false

      - name: Cache verified Gradle inputs
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*gradle.lockfile', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.jar', 'gradle/libs.versions.toml') }}

      - name: Install pinned Android packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
            "platforms;android-36" `
            "build-tools;36.1.0" `
            "ndk;29.0.14206865" `
            "cmake;4.1.2"

      - name: Verify pinned entry points
        shell: pwsh
        run: |
          if ((node --version) -ne "v24.12.0") { exit 1 }
          $javaVersion = (& java -version 2>&1 | Select-Object -First 1)
          if ($javaVersion -notmatch '"17\.0\.19"') { exit 1 }
          .\gradlew.bat --no-daemon --version

      - name: Run Windows checks
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean check verifyGovernance `
            "-Paapt2Executable=$env:ANDROID_HOME\build-tools\36.1.0\aapt2.exe" `
            "-Paapt2AndroidJar=$env:ANDROID_HOME\platforms\android-36\android.jar"

      - name: Verify M1-01 byte-identical reports
        shell: pwsh
        run: |
          $canonical = "host/apk-inspector/build/reports/m1-01/canonical-model.json"
          $errors = "host/apk-inspector/build/reports/m1-01/error-matrix.json"
          $canonicalHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $canonical).Hash.ToLowerInvariant()
          $errorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $errors).Hash.ToLowerInvariant()
          if ($canonicalHash -ne "c15561ee6d6e879ad9db058be2762282538a77d4204279d6b5d6d57b1f1d52bf") { exit 1 }
          if ($errorHash -ne "b396616ff369fa2d4db56c92f6908253339867d71554f96debee4d7ed06a02fc") { exit 1 }
          Write-Output "$canonicalHash  $canonical"
          Write-Output "$errorHash  $errors"

      - name: Verify M1-02 byte-identical signer reports
        shell: pwsh
        run: |
          $policy = "host/apk-inspector/build/reports/m1-02/canonical-policy.json"
          $errors = "host/apk-inspector/build/reports/m1-02/error-matrix.json"
          $policyHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $policy).Hash.ToLowerInvariant()
          $errorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $errors).Hash.ToLowerInvariant()
          if ($policyHash -ne "b945ede114fd87771631b862c5f7a22120bc5aac2db6bbc836cfb608a54f52a2") { exit 1 }
          if ($errorHash -ne "c33d342077c371878399c80e76ae025cd0efc56bfcca6d5bf80ffde4d75677c6") { exit 1 }
          Write-Output "$policyHash  $policy"
          Write-Output "$errorHash  $errors"

      - name: Verify M1-03 byte-identical AXML reports
        shell: pwsh
        run: |
          $expected = @{
            "host/axml/build/reports/m1-03/transform-matrix.json" = "35bd420aa0fe05e1a5efee197bdea8d3699f5de743bf54974f13833e24ef5635"
            "host/axml/build/reports/m1-03/error-matrix.json" = "9a60c0c9fe710798d7f458822c1f2d6ffb9a22527a43c176c6c3869fb6dcf49c"
            "host/axml/build/reports/m1-03/fuzz-summary.json" = "d1dbf919a489a067506ab40b629916ea66a5b8a3e3ced42e710ae8dc57f8dced"
            "host/axml/build/reports/m1-03/aapt2-cross-check.json" = "916e2d79af152c6090fc7ba0c4b9b24f054f0eb094ff2968192b922d0d593672"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry.Key).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { exit 1 }
            Write-Output "$actual  $($entry.Key)"
          }

      - name: Verify M1-04 byte-identical AHDC v2 container
        shell: pwsh
        run: |
          node tools/validation/verify-ahdc-v2-vector.mjs
          $container = "host/container/build/reports/m1-04/work/deterministic-a.ahdc"
          $vector = "host/container/build/reports/m1-04/cross-language-vector.json"
          $consumer = "host/container/build/reports/m1-04/cross-language-consumer.json"
          $containerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $container).Hash.ToLowerInvariant()
          $vectorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $vector).Hash.ToLowerInvariant()
          $consumerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $consumer).Hash.ToLowerInvariant()
          if ($containerHash -ne "3764b908e534ffa5179a9519045ec74a7caa44b30c80447998c593a1ac2fa60d") { exit 1 }
          if ($vectorHash -ne "3b2421fcc91234333d13545826b51fbf0de25c5fa26b39aa17d90a9ff2133afc") { exit 1 }
          if ($consumerHash -ne "542ba9db02b643f445fc9194220e7fac6debb28e45089de38403843c78be2b1a") { exit 1 }
          Write-Output "$containerHash  $container"
          Write-Output "$vectorHash  $vector"
          Write-Output "$consumerHash  $consumer"

      - name: Verify M1-05 byte-identical repacker reports
        shell: pwsh
        run: |
          $expected = @{
            "host/repacker/build/reports/m1-05/entry-manifest.json" = "606eb0d4a28d2235d054273b749740eaaff2fdf0891d84e582291ff327e2d687"
            "host/repacker/build/reports/m1-05/error-matrix.json" = "3c5b1283874f101b9007d67c2bdceff002afff0505292f91398401ab4cb2f941"
            "host/repacker/build/reports/m1-05/alignment-report.json" = "c173698b586d53b61874611cc36930725dd8ce7ea2f737c51b02d5afa7e427bd"
            "host/repacker/build/reports/m1-05/abi-matrix.json" = "add443496d258e389917d7fabaf1ea7d59b120d7d57b088969bb89976da3f5b8"
            "host/repacker/build/reports/m1-05/external-tools.json" = "9723e87adedf97b176ea186baf0309159981e0154fedd25f46841d53f0bde29b"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry.Key).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { exit 1 }
            Write-Output "$actual  $($entry.Key)"
          }
