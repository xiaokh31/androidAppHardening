name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Build (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK
        # actions/setup-java v5
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false

      - name: Cache verified Gradle inputs
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*gradle.lockfile', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.jar', 'gradle/libs.versions.toml') }}

      - name: Install pinned Android packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;4.1.2"

      - name: Prepare verified M2-07 Native crypto source
        shell: bash
        run: |
          set -euo pipefail
          archive=".toolchains/native-crypto/downloads/mbedtls-4.1.1.tar.bz2"
          source_parent=".toolchains/native-crypto/src"
          source_root="$source_parent/mbedtls-4.1.1"
          extract_root="$source_parent/.mbedtls-4.1.1.extract"
          cleanup() {
            rm -rf -- "$extract_root" "$source_root"
            rm -f -- "$archive"
          }
          trap cleanup ERR
          mkdir -p "$(dirname "$archive")" "$source_parent"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-4.1.1/mbedtls-4.1.1.tar.bz2"
          node tools/validation/verify-m2-07-native-crypto.mjs --archive-only
          while IFS= read -r member; do
            case "$member" in
              mbedtls-4.1.1/*) ;;
              *) echo "unsafe or unexpected archive member: $member" >&2; exit 1 ;;
            esac
            case "/$member/" in
              */../*) echo "archive traversal member: $member" >&2; exit 1 ;;
            esac
          done < <(tar -tjf "$archive")
          rm -rf -- "$extract_root" "$source_root"
          mkdir "$extract_root"
          tar -xjf "$archive" -C "$extract_root"
          node tools/validation/verify-m2-07-native-crypto.mjs --self-test --pre-promote \
            --source-root="$extract_root/mbedtls-4.1.1"
          printf '%s\n' \
            'archive_sha256=3359a349e23db3d5536fcee032ae7b2ecbfc08972fab643089b5cbf2a375c98c' \
            'source_tree_sha256=7c4ba6554fed6eb67c201054bc75b124fcdc0649e2f56cd762746e01a25d2140' \
            > "$extract_root/mbedtls-4.1.1/.aah-m2-07-verified"
          mv "$extract_root/mbedtls-4.1.1" "$source_root"
          rmdir "$extract_root"
          node tools/validation/verify-m2-07-native-crypto.mjs --self-test
          trap - ERR

      - name: Run M2-07 Host crypto vectors
        shell: bash
        run: |
          cmake_bin="$ANDROID_HOME/cmake/4.1.2/bin/cmake"
          ctest_bin="$ANDROID_HOME/cmake/4.1.2/bin/ctest"
          "$cmake_bin" \
            -S runtime/native/src/main/cpp \
            -B runtime/native/build/m2-07-host \
            -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$ANDROID_HOME/cmake/4.1.2/bin/ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAH_MBEDTLS_ROOT="$PWD/.toolchains/native-crypto/src/mbedtls-4.1.1"
          "$cmake_bin" --build runtime/native/build/m2-07-host --config Release
          "$ctest_bin" --test-dir runtime/native/build/m2-07-host --output-on-failure

      - name: Verify pinned entry points
        shell: bash
        run: |
          test "$(node --version)" = "v24.12.0"
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/.*java.version = //p')" = "17.0.19"
          ./gradlew --no-daemon --version

      - name: Run full Linux checks
        shell: bash
        run: >-
          ./gradlew --no-daemon clean check lint verifyGovernance :runtime:native:assembleRelease
          -Paapt2Executable="$ANDROID_HOME/build-tools/36.1.0/aapt2"
          -Paapt2AndroidJar="$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Verify M1-01 byte-identical reports
        shell: bash
        run: |
          canonical="host/apk-inspector/build/reports/m1-01/canonical-model.json"
          errors="host/apk-inspector/build/reports/m1-01/error-matrix.json"
          test "$(sha256sum "$canonical" | awk '{print $1}')" = "c15561ee6d6e879ad9db058be2762282538a77d4204279d6b5d6d57b1f1d52bf"
          test "$(sha256sum "$errors" | awk '{print $1}')" = "b396616ff369fa2d4db56c92f6908253339867d71554f96debee4d7ed06a02fc"
          sha256sum "$canonical" "$errors"

      - name: Verify M1-02 byte-identical signer reports
        shell: bash
        run: |
          policy="host/apk-inspector/build/reports/m1-02/canonical-policy.json"
          errors="host/apk-inspector/build/reports/m1-02/error-matrix.json"
          test "$(sha256sum "$policy" | awk '{print $1}')" = "b945ede114fd87771631b862c5f7a22120bc5aac2db6bbc836cfb608a54f52a2"
          test "$(sha256sum "$errors" | awk '{print $1}')" = "c33d342077c371878399c80e76ae025cd0efc56bfcca6d5bf80ffde4d75677c6"
          sha256sum "$policy" "$errors"

      - name: Verify M1-03 byte-identical AXML reports
        shell: bash
        run: |
          transforms="host/axml/build/reports/m1-03/transform-matrix.json"
          errors="host/axml/build/reports/m1-03/error-matrix.json"
          fuzz="host/axml/build/reports/m1-03/fuzz-summary.json"
          aapt2="host/axml/build/reports/m1-03/aapt2-cross-check.json"
          test "$(sha256sum "$transforms" | awk '{print $1}')" = "35bd420aa0fe05e1a5efee197bdea8d3699f5de743bf54974f13833e24ef5635"
          test "$(sha256sum "$errors" | awk '{print $1}')" = "9a60c0c9fe710798d7f458822c1f2d6ffb9a22527a43c176c6c3869fb6dcf49c"
          test "$(sha256sum "$fuzz" | awk '{print $1}')" = "d1dbf919a489a067506ab40b629916ea66a5b8a3e3ced42e710ae8dc57f8dced"
          test "$(sha256sum "$aapt2" | awk '{print $1}')" = "916e2d79af152c6090fc7ba0c4b9b24f054f0eb094ff2968192b922d0d593672"
          sha256sum "$transforms" "$errors" "$fuzz" "$aapt2"

      - name: Verify M1-04 byte-identical AHDC v2 container
        shell: bash
        run: |
          node tools/validation/verify-ahdc-v2-vector.mjs
          container="host/container/build/reports/m1-04/work/deterministic-a.ahdc"
          vector="host/container/build/reports/m1-04/cross-language-vector.json"
          consumer="host/container/build/reports/m1-04/cross-language-consumer.json"
          test "$(sha256sum "$container" | awk '{print $1}')" = "3764b908e534ffa5179a9519045ec74a7caa44b30c80447998c593a1ac2fa60d"
          test "$(sha256sum "$vector" | awk '{print $1}')" = "3b2421fcc91234333d13545826b51fbf0de25c5fa26b39aa17d90a9ff2133afc"
          test "$(sha256sum "$consumer" | awk '{print $1}')" = "542ba9db02b643f445fc9194220e7fac6debb28e45089de38403843c78be2b1a"
          sha256sum "$container" "$vector" "$consumer"

      - name: Verify M1-05 byte-identical repacker reports
        shell: bash
        run: |
          declare -A expected=(
            ["host/repacker/build/reports/m1-05/entry-manifest.json"]="1a4caf8b01af9326d3ff3e8c9581d4c4ce40e0f7c5aefa1f8ee63ca0b018e201"
            ["host/repacker/build/reports/m1-05/error-matrix.json"]="cc624a344cb82df3074b46ed39c8776c2bdb2e962e22fe3c46a667adf16da21d"
            ["host/repacker/build/reports/m1-05/cleanup-matrix.json"]="474cd013d51c3b8faec5d25863d31288b4de4af3a095e14c78acb659df4e52b5"
            ["host/repacker/build/reports/m1-05/alignment-report.json"]="a9b153f5ad01cbc7df8aa993416fb5d819e05ee5029a89bc5edf38b3d80e4a5b"
            ["host/repacker/build/reports/m1-05/abi-matrix.json"]="add443496d258e389917d7fabaf1ea7d59b120d7d57b088969bb89976da3f5b8"
            ["host/repacker/build/reports/m1-05/external-tools.json"]="9723e87adedf97b176ea186baf0309159981e0154fedd25f46841d53f0bde29b"
          )
          for file in "${!expected[@]}"; do
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "${expected[$file]}"
            echo "$actual  $file"
          done

      - name: Verify M1-06 byte-identical CLI reports
        shell: bash
        run: |
          declare -A expected=(
            ["host/cli/build/reports/m1-06/integration/normalized-success.json"]="71052641e1e8933b6104087362180125f88b4ff8dfe4a34b7e4851b1e304c213"
            ["host/cli/build/reports/m1-06/integration/error-matrix.json"]="9de958b0855ec939d9f7523880552e2962b4144dbea76fcc37d393d9397e785e"
            ["host/cli/build/reports/m1-06/integration/cleanup-matrix.json"]="03f9f1b80b7a562db4d406fdda23deab03b688bc87fd50fb8d913283da956598"
            ["host/cli/build/reports/m1-06/unit/path-error-matrix.json"]="ea48b25b0c8f561bb533f0df578a0755f27a6a0c257ffd600a976c0687b1e4a5"
          )
          for file in "${!expected[@]}"; do
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "${expected[$file]}"
            echo "$actual  $file"
          done

      - name: Test dependency verification failure
        shell: bash
        run: node tools/validation/test-dependency-verification.mjs

      - name: Verify four Native ABIs
        shell: bash
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            file="runtime/native/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/$abi/libah_runtime.so"
            test -f "$file"
            test "$(stat -c%s "$file")" -gt 100000
            readelf="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
            nm="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
            "$readelf" -h -d "$file"
            "$readelf" -d "$file" | grep -q BIND_NOW
            if "$readelf" -d "$file" | grep -E 'libcrypto|libssl|mbedtls|mbedx509'; then
              echo "unexpected dynamic crypto/TLS dependency in $file" >&2
              exit 1
            fi
            if "$nm" -D --defined-only "$file" | grep -E '(^| )psa_|(^| )mbedtls_'; then
              echo "unexpected exported upstream crypto symbol in $file" >&2
              exit 1
            fi
            unstripped="$(find runtime/native/build/intermediates/cxx/RelWithDebInfo -path "*/obj/$abi/libah_runtime.so" -type f -print -quit)"
            test -n "$unstripped"
            symbols="$("$nm" -C --defined-only "$unstripped")"
            grep -q 'aes256GcmDecrypt' <<<"$symbols"
            grep -q 'hkdfSha256' <<<"$symbols"
            grep -q 'secureZero' <<<"$symbols"
            grep -q 'ah_crypto_backend_anchor' <<<"$symbols"
            if grep -Ei '(^|[_: ])(rsa|ecc|ecdsa|ecdh|chacha|ccm|cbc|x509|ssl|pkcs)([_: (]|$)' <<<"$symbols"; then
              echo "unexpected out-of-scope crypto symbol in $unstripped" >&2
              exit 1
            fi
            sha256sum "$file" "$unstripped"
          done

  windows:
    name: Build (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Temurin JDK
        # actions/setup-java v5
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false

      - name: Cache verified Gradle inputs
        # actions/cache v5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*gradle.lockfile', 'gradle/verification-metadata.xml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.jar', 'gradle/libs.versions.toml') }}

      - name: Install pinned Android packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
            "platforms;android-36" `
            "build-tools;36.1.0" `
            "ndk;29.0.14206865" `
            "cmake;4.1.2"

      - name: Prepare verified M2-07 Native crypto source
        shell: pwsh
        run: |
          $archiveDir = Join-Path $pwd ".toolchains/native-crypto/downloads"
          $sourceParent = Join-Path $pwd ".toolchains/native-crypto/src"
          $sourceRoot = Join-Path $sourceParent "mbedtls-4.1.1"
          $extractRoot = Join-Path $sourceParent ".mbedtls-4.1.1.extract"
          $archive = Join-Path $archiveDir "mbedtls-4.1.1.tar.bz2"
          $cmake = "$env:ANDROID_HOME/cmake/4.1.2/bin/cmake.exe"
          New-Item -ItemType Directory -Force -Path $archiveDir, $sourceParent | Out-Null
          try {
            curl.exe --fail --location --retry 3 `
              --output $archive `
              "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-4.1.1/mbedtls-4.1.1.tar.bz2"
            if ($LASTEXITCODE -ne 0) { throw "M2-07 archive download failed: $LASTEXITCODE" }
            node tools/validation/verify-m2-07-native-crypto.mjs --archive-only
            if ($LASTEXITCODE -ne 0) { throw "M2-07 archive verification failed: $LASTEXITCODE" }
            $members = & $cmake -E tar tjf $archive
            if ($LASTEXITCODE -ne 0) { throw "M2-07 verified archive listing failed: $LASTEXITCODE" }
            foreach ($memberValue in $members) {
              $member = "$memberValue".Replace('\', '/')
              $segments = $member.Split('/', [System.StringSplitOptions]::RemoveEmptyEntries)
              if (-not $member.StartsWith('mbedtls-4.1.1/') -or $member.StartsWith('/') -or $segments -contains '..') {
                throw "unsafe or unexpected archive member: $member"
              }
            }
            Remove-Item -Recurse -Force -LiteralPath $extractRoot, $sourceRoot -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $extractRoot | Out-Null
            Push-Location $extractRoot
            try {
              & $cmake -E tar xjf $archive
              if ($LASTEXITCODE -ne 0) { throw "M2-07 verified archive extraction failed: $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
            node tools/validation/verify-m2-07-native-crypto.mjs --self-test --pre-promote `
              "--source-root=$extractRoot/mbedtls-4.1.1"
            if ($LASTEXITCODE -ne 0) { throw "M2-07 temporary source-tree verification failed: $LASTEXITCODE" }
            $stampPath = "$extractRoot/mbedtls-4.1.1/.aah-m2-07-verified"
            $stamp = "archive_sha256=3359a349e23db3d5536fcee032ae7b2ecbfc08972fab643089b5cbf2a375c98c`n" +
              "source_tree_sha256=7c4ba6554fed6eb67c201054bc75b124fcdc0649e2f56cd762746e01a25d2140`n"
            [IO.File]::WriteAllText($stampPath, $stamp, [Text.UTF8Encoding]::new($false))
            Move-Item -LiteralPath "$extractRoot/mbedtls-4.1.1" -Destination $sourceRoot
            Remove-Item -LiteralPath $extractRoot
            node tools/validation/verify-m2-07-native-crypto.mjs --self-test
            if ($LASTEXITCODE -ne 0) { throw "M2-07 promoted source-tree verification failed: $LASTEXITCODE" }
          } catch {
            Remove-Item -Recurse -Force -LiteralPath $extractRoot, $sourceRoot -ErrorAction SilentlyContinue
            Remove-Item -Force -LiteralPath $archive -ErrorAction SilentlyContinue
            throw
          }

      - name: Run M2-07 Host crypto vectors
        shell: pwsh
        run: |
          $cmake = "$env:ANDROID_HOME/cmake/4.1.2/bin/cmake.exe"
          $ctest = "$env:ANDROID_HOME/cmake/4.1.2/bin/ctest.exe"
          $ninja = "$env:ANDROID_HOME/cmake/4.1.2/bin/ninja.exe"
          $vsDevCmd = "C:/Program Files/Microsoft Visual Studio/18/Enterprise/Common7/Tools/VsDevCmd.bat"
          $clangCl = "C:/Program Files/LLVM/bin/clang-cl.exe"
          if ($env:ImageOS -ne "win25-vs2026" -or $env:ImageVersion -ne "20260803.193") {
            throw "unexpected mutable runner image: ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          }
          if (-not (Test-Path -LiteralPath $vsDevCmd)) { throw "missing pinned runner compiler environment: $vsDevCmd" }
          if (-not (Test-Path -LiteralPath $clangCl)) { throw "missing pinned runner clang-cl: $clangCl" }
          $clangVersion = (& $clangCl --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $clangVersion -notmatch '(?m)^clang version 20\.1\.8(?:\s|$)') {
            throw "unexpected clang-cl version: $clangVersion"
          }
          $vsEnvLines = & cmd.exe /d /s /c "`"$vsDevCmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($line in $vsEnvLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
            }
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw "VS 2026 x64 compiler environment was not activated" }
          $clVersion = (& cl.exe 2>&1) -join "`n"
          if ($clVersion -notmatch 'Version 19\.51\.36252\.0') {
            throw "unexpected VS compiler environment: $clVersion"
          }
          & $cmake `
            -S runtime/native/src/main/cpp `
            -B runtime/native/build/m2-07-host `
            -G Ninja `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_C_COMPILER=$clangCl" `
            "-DCMAKE_CXX_COMPILER=$clangCl" `
            -DCMAKE_BUILD_TYPE=Release `
            "-DAH_MBEDTLS_ROOT=$pwd/.toolchains/native-crypto/src/mbedtls-4.1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cmake --build runtime/native/build/m2-07-host --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $ctest --test-dir runtime/native/build/m2-07-host --output-on-failure

      - name: Verify pinned entry points
        shell: pwsh
        run: |
          if ((node --version) -ne "v24.12.0") { exit 1 }
          $javaVersion = (& java -version 2>&1 | Select-Object -First 1)
          if ($javaVersion -notmatch '"17\.0\.19"') { exit 1 }
          .\gradlew.bat --no-daemon --version

      - name: Run Windows checks
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon clean check verifyGovernance :runtime:native:assembleRelease `
            "-Paapt2Executable=$env:ANDROID_HOME\build-tools\36.1.0\aapt2.exe" `
            "-Paapt2AndroidJar=$env:ANDROID_HOME\platforms\android-36\android.jar"

      - name: Verify M1-01 byte-identical reports
        shell: pwsh
        run: |
          $canonical = "host/apk-inspector/build/reports/m1-01/canonical-model.json"
          $errors = "host/apk-inspector/build/reports/m1-01/error-matrix.json"
          $canonicalHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $canonical).Hash.ToLowerInvariant()
          $errorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $errors).Hash.ToLowerInvariant()
          if ($canonicalHash -ne "c15561ee6d6e879ad9db058be2762282538a77d4204279d6b5d6d57b1f1d52bf") { exit 1 }
          if ($errorHash -ne "b396616ff369fa2d4db56c92f6908253339867d71554f96debee4d7ed06a02fc") { exit 1 }
          Write-Output "$canonicalHash  $canonical"
          Write-Output "$errorHash  $errors"

      - name: Verify M1-02 byte-identical signer reports
        shell: pwsh
        run: |
          $policy = "host/apk-inspector/build/reports/m1-02/canonical-policy.json"
          $errors = "host/apk-inspector/build/reports/m1-02/error-matrix.json"
          $policyHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $policy).Hash.ToLowerInvariant()
          $errorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $errors).Hash.ToLowerInvariant()
          if ($policyHash -ne "b945ede114fd87771631b862c5f7a22120bc5aac2db6bbc836cfb608a54f52a2") { exit 1 }
          if ($errorHash -ne "c33d342077c371878399c80e76ae025cd0efc56bfcca6d5bf80ffde4d75677c6") { exit 1 }
          Write-Output "$policyHash  $policy"
          Write-Output "$errorHash  $errors"

      - name: Verify M1-03 byte-identical AXML reports
        shell: pwsh
        run: |
          $expected = @{
            "host/axml/build/reports/m1-03/transform-matrix.json" = "35bd420aa0fe05e1a5efee197bdea8d3699f5de743bf54974f13833e24ef5635"
            "host/axml/build/reports/m1-03/error-matrix.json" = "9a60c0c9fe710798d7f458822c1f2d6ffb9a22527a43c176c6c3869fb6dcf49c"
            "host/axml/build/reports/m1-03/fuzz-summary.json" = "d1dbf919a489a067506ab40b629916ea66a5b8a3e3ced42e710ae8dc57f8dced"
            "host/axml/build/reports/m1-03/aapt2-cross-check.json" = "916e2d79af152c6090fc7ba0c4b9b24f054f0eb094ff2968192b922d0d593672"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry.Key).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { exit 1 }
