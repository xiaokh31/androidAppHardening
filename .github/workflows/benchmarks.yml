name: M3-05 Benchmarks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/benchmarks.yml"
      - "benchmarks/**"
      - "fixtures/android/**"
      - "host/**"
      - "integration-tests/**"
      - "runtime/**"
      - "tools/validation/run-m3-05-android-benchmark.mjs"
      - "tools/validation/verify-m3-05-test-bridge-artifacts.mjs"
      - "tools/validation/compare-m3-05-benchmarks.mjs"
      - "gradle/**"

permissions:
  contents: read

concurrency:
  group: m3-05-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Temurin JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17.0.19+10"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false
      - name: Install pinned Android packages
        shell: pwsh
        run: |
          $sdkmanager = if ($IsWindows) {
            Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager.bat"
          } else {
            Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager"
          }
          & $sdkmanager "platforms;android-36" "build-tools;36.1.0" `
            "ndk;29.0.14206865" "cmake;4.1.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run two fixed Host benchmark passes
        shell: pwsh
        run: |
          $gradle = if ($IsWindows) { ".\gradlew.bat" } else { "./gradlew" }
          $environment = "$($env:RUNNER_OS.ToLowerInvariant())-$([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant())"
          & $gradle --no-daemon --console=plain :benchmarks:host:jmh "-Pm305Environment=$environment"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/governance/verify-m3-07-high-benchmark-contract.mjs --report benchmarks/host/build/m3-05/benchmark-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/m3-05/host-run1,build/m3-05/host-run2 | Out-Null
          Copy-Item -Recurse -Force benchmarks/host/build/m3-05/* build/m3-05/host-run1/
          & $gradle --no-daemon --console=plain :benchmarks:host:jmh "-Pm305Environment=$environment"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/governance/verify-m3-07-high-benchmark-contract.mjs --report benchmarks/host/build/m3-05/benchmark-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse -Force benchmarks/host/build/m3-05/* build/m3-05/host-run2/
          node tools/validation/compare-m3-05-benchmarks.mjs `
            build/m3-05/host-run1/benchmark-results.json `
            build/m3-05/host-run2/benchmark-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Host benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-05-host-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: build/m3-05/host-run*/
