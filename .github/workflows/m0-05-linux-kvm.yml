name: M0-05 Linux KVM

on:
  push:
    branches:
      - spike/m0-05-application-factory-provider-jni-poc
      - feat/m2-02-native-decrypt-loader
      - feat/m2-03-runtime-integrity
      - feat/m2-04-four-abi-runtime
    paths:
      - ".github/workflows/m0-05-linux-kvm.yml"
      - "fixtures/android/**"
      - "runtime/bootstrap/**"
      - "runtime/native/**"
      - "runtime/policy/**"
      - "host/container/**"
      - "host/axml/**"
      - "integration-tests/**"
      - "tools/validation/**"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/m0-05-linux-kvm.yml"
      - "fixtures/android/**"
      - "runtime/bootstrap/**"
      - "runtime/native/**"
      - "runtime/policy/**"
      - "host/container/**"
      - "host/axml/**"
      - "integration-tests/**"
      - "tools/validation/**"

permissions:
  contents: read

concurrency:
  # The M2-02 branch push is the pre-review frozen-SHA KVM gate.
  group: m0-05-kvm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: API ${{ matrix.api }} x86_64 (Linux/KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            revision: 8
            package_index: 1
          - api: 36
            revision: 2
            package_index: 2
    steps:
      - name: Check out repository
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify pinned Ubuntu runner and Host compiler
        shell: bash
        run: |
          set -euo pipefail
          test "${ImageOS:-}" = "ubuntu24"
          case "${ImageVersion:-}" in
            20260720.247.2) reviewed_manifest='ubuntu24/20260720.247' ;;
            20260804.265.1) reviewed_manifest='ubuntu24/20260804.265' ;;
            20260810.271.1) reviewed_manifest='ubuntu24/20260810.271' ;;
            *) printf 'unexpected mutable runner image: ImageOS=%s ImageVersion=%s\n' "${ImageOS:-}" "${ImageVersion:-}" >&2; exit 1 ;;
          esac
          test "$(gcc -dumpfullversion -dumpversion)" = "13.3.0"
          test "$(g++ -dumpfullversion -dumpversion)" = "13.3.0"
          printf '%s\n' \
            "runner_image=ubuntu24/${ImageVersion}" \
            "runner_manifest_ref=${reviewed_manifest}" \
            'host_c_compiler=gcc/13.3.0' \
            'host_cxx_compiler=g++/13.3.0'

      - name: Set up Temurin JDK
        # actions/setup-java v5
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17.0.19+10"

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.12.0
          check-latest: false

      - name: Prepare project-local pinned Android runtime
        shell: bash
        env:
          API: ${{ matrix.api }}
          PACKAGE_INDEX: ${{ matrix.package_index }}
        run: |
          set -euo pipefail
          manifest="tools/validation/m0-05-linux-kvm-packages.json"
          sdk_root="$GITHUB_WORKSPACE/.toolchains/android-m0-05-ci"
          downloads="$sdk_root/downloads"
          mkdir -p "$downloads" "$sdk_root/system-images/android-$API/default" build/m0-05

          pulse_package="$(jq -r '.host_packages[0].package' "$manifest")"
          pulse_version="$(jq -r '.host_packages[0].version' "$manifest")"
          test "$pulse_package" = "libpulse0"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$pulse_package=$pulse_version"
          test "$(dpkg-query -W -f='${Version}' "$pulse_package")" = "$pulse_version"
          dpkg-query -W -f='${Package}=${Version}\n' "$pulse_package" \
            | tee build/m0-05/ubuntu-runtime-packages.txt

          for directory in cmdline-tools licenses platform-tools; do
            test -e "$ANDROID_HOME/$directory"
            ln -s "$ANDROID_HOME/$directory" "$sdk_root/$directory"
          done

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;4.1.2"

          emulator_url="$(jq -r '.packages[0].archive_url' "$manifest")"
          emulator_name="$(jq -r '.packages[0].archive' "$manifest")"
          emulator_sha="$(jq -r '.packages[0].sha256' "$manifest")"
          emulator_bytes="$(jq -r '.packages[0].bytes' "$manifest")"
          image_url="$(jq -r ".packages[$PACKAGE_INDEX].archive_url" "$manifest")"
          image_name="$(jq -r ".packages[$PACKAGE_INDEX].archive" "$manifest")"
          image_sha="$(jq -r ".packages[$PACKAGE_INDEX].sha256" "$manifest")"
          image_bytes="$(jq -r ".packages[$PACKAGE_INDEX].bytes" "$manifest")"

          curl --fail --location --retry 3 --output "$downloads/$emulator_name" "$emulator_url"
          curl --fail --location --retry 3 --output "$downloads/$image_name" "$image_url"
          test "$(stat -c %s "$downloads/$emulator_name")" = "$emulator_bytes"
          test "$(stat -c %s "$downloads/$image_name")" = "$image_bytes"
          echo "$emulator_sha  $downloads/$emulator_name" | sha256sum --check --strict
          echo "$image_sha  $downloads/$image_name" | sha256sum --check --strict

          unzip -q "$downloads/$emulator_name" -d "$sdk_root"
          unzip -q "$downloads/$image_name" -d "$sdk_root/system-images/android-$API/default"
          test -x "$sdk_root/emulator/emulator"
          image_dir="$sdk_root/system-images/android-$API/default/x86_64"
          source_properties="$image_dir/source.properties"
          test -f "$source_properties"
          grep -Fx "Pkg.Revision=${{ matrix.revision }}" "$source_properties"
          grep -Fx "AndroidVersion.ApiLevel=$API" "$source_properties"
          grep -Fx "SystemImage.Abi=x86_64" "$source_properties"
          test -f "$image_dir/system.img"
          test -f "$image_dir/kernel-ranchu"
          test -f "$image_dir/ramdisk.img"
          "$sdk_root/emulator/emulator" -version | tee "$GITHUB_WORKSPACE/build-emulator-version.txt"
          grep -F "Android emulator version 37.1.11" "$GITHUB_WORKSPACE/build-emulator-version.txt"

          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$sdk_root/avd" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"

      - name: Prepare verified M2-07 Native crypto source
        shell: bash
        run: |
          set -euo pipefail
          archive=".toolchains/native-crypto/downloads/mbedtls-4.1.1.tar.bz2"
          source_parent=".toolchains/native-crypto/src"
          source_root="$source_parent/mbedtls-4.1.1"
          extract_root="$source_parent/.mbedtls-4.1.1.extract"
          cleanup() {
            rm -rf -- "$extract_root" "$source_root"
            rm -f -- "$archive"
          }
          trap cleanup ERR
          mkdir -p "$(dirname "$archive")" "$source_parent"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-4.1.1/mbedtls-4.1.1.tar.bz2"
          node tools/validation/verify-m2-07-native-crypto.mjs --archive-only
          while IFS= read -r member; do
            case "$member" in
              mbedtls-4.1.1/*) ;;
              *) echo "unsafe or unexpected archive member: $member" >&2; exit 1 ;;
            esac
            case "/$member/" in
              */../*) echo "archive traversal member: $member" >&2; exit 1 ;;
            esac
          done < <(tar -tjf "$archive")
          rm -rf -- "$extract_root" "$source_root"
          mkdir "$extract_root"
          tar -xjf "$archive" -C "$extract_root"
          node tools/validation/verify-m2-07-native-crypto.mjs --self-test --pre-promote \
            --source-root="$extract_root/mbedtls-4.1.1"
          printf '%s\n' \
            'archive_sha256=3359a349e23db3d5536fcee032ae7b2ecbfc08972fab643089b5cbf2a375c98c' \
            'source_tree_sha256=7c4ba6554fed6eb67c201054bc75b124fcdc0649e2f56cd762746e01a25d2140' \
            > "$extract_root/mbedtls-4.1.1/.aah-m2-07-verified"
          mv "$extract_root/mbedtls-4.1.1" "$source_root"
          rmdir "$extract_root"
          node tools/validation/verify-m2-07-native-crypto.mjs --self-test
          trap - ERR

      - name: Build signed Release/R8 fixtures in two passes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}" = "chore/m3-01-android-fixtures" ]]; then
            printf '%s\n' 'M3-01 builds and signs its isolated fixture matrix inside the bounded device step.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/m0-05-signing" build/m0-05
          export M005_TEST_KEYSTORE="$RUNNER_TEMP/m0-05-signing/fixture.p12"
          export M005_TEST_STORE_PASSWORD="$(openssl rand -hex 24)"
          export M005_TEST_KEY_ALIAS="fixture"
          export M005_TEST_KEY_PASSWORD="$M005_TEST_STORE_PASSWORD"
          echo "::add-mask::$M005_TEST_STORE_PASSWORD"
          echo "::add-mask::$M005_TEST_KEY_PASSWORD"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$M005_TEST_KEYSTORE" \
            -storepass "$M005_TEST_STORE_PASSWORD" \
            -keypass "$M005_TEST_KEY_PASSWORD" \
            -alias "$M005_TEST_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=M0-05 Ephemeral Fixture,O=androidAppHardening,C=US"
          signing_env="$RUNNER_TEMP/m0-05-signing/m2-04.env"
          (
            umask 077
            {
              printf 'export M005_TEST_KEYSTORE=%q\n' "$M005_TEST_KEYSTORE"
              printf 'export M005_TEST_STORE_PASSWORD=%q\n' "$M005_TEST_STORE_PASSWORD"
              printf 'export M005_TEST_KEY_ALIAS=%q\n' "$M005_TEST_KEY_ALIAS"
              printf 'export M005_TEST_KEY_PASSWORD=%q\n' "$M005_TEST_KEY_PASSWORD"
            } > "$signing_env"
          )

          ./gradlew --no-daemon --console=plain \
            :fixtures:android:assembleCompatExtractedRelease
          signer_digest="$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs \
            fixtures/android/build/outputs/apk/compatExtracted/release/android-compatExtracted-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "${#signer_digest}" = 64
          echo "$signer_digest" > "$RUNNER_TEMP/m0-05-signing/signer-sha256.txt"

          ./gradlew --no-daemon --console=plain "-Pm005ExpectedSignerSha256=$signer_digest" \
            :tools:validation:testM005ConfigParser \
            :fixtures:android:assembleClassloaderPocRelease \
            :fixtures:android:assembleCompatExtractedDebugAndroidTest \
            :fixtures:android:assembleCompatDirectDebugAndroidTest \
            :fixtures:android:assembleCompatExtractedRelease \
            :fixtures:android:assembleCompatDirectRelease

          node tools/validation/verify-m0-05-apks.mjs \
            fixtures/android/build/outputs/apk/compatExtracted/release/android-compatExtracted-release.apk \
            fixtures/android/build/outputs/apk/compatDirect/release/android-compatDirect-release.apk \
            fixtures/android/build/outputs/apk/androidTest/compatExtracted/debug/android-compatExtracted-debug-androidTest.apk \
            fixtures/android/build/outputs/apk/androidTest/compatDirect/debug/android-compatDirect-debug-androidTest.apk \
            fixtures/android/build/outputs/mapping/compatExtractedRelease/mapping.txt \
            fixtures/android/build/outputs/mapping/compatExtractedRelease/usage.txt \
            fixtures/android/build/outputs/mapping/compatDirectRelease/mapping.txt \
            fixtures/android/build/outputs/mapping/compatDirectRelease/usage.txt \
            fixtures/android/build/outputs/apk/classloaderPoc/release/android-classloaderPoc-release.apk \
            "$signer_digest" | tee build/m0-05/static-report.json

          mkdir -p build/m1-03/device-apks
          for variant in extracted direct; do
            input_apk="fixtures/android/build/outputs/apk/compat${variant^}/release/android-compat${variant^}-release.apk"
            transformed_apk="build/m1-03/device-apks/m1-03-${variant}.apk"
            original_manifest="build/m1-03/device-apks/${variant}-original.bin"
            transformed_manifest="build/m1-03/device-apks/${variant}-transformed.bin"
            package_name="ah.fixtures.android.m005.${variant}"
            node tools/validation/create-m1-03-device-apk.mjs \
              prepare "$variant" "$original_manifest" \
              | tee "build/m1-03/device-apks/${variant}-prepare-report.json"
            ./gradlew --no-daemon --console=plain :host:axml:transformDeviceManifest \
              "-Pm103InputManifest=$original_manifest" \
              "-Pm103OutputManifest=$transformed_manifest" \
              "-Pm103PackageName=$package_name"
            node tools/validation/create-m1-03-device-apk.mjs \
              package "$input_apk" "$variant" "$transformed_manifest" "$transformed_apk" \
              | tee "build/m1-03/device-apks/${variant}-creation-report.json"
          done

          node tools/validation/verify-m0-05-apks.mjs \
            build/m1-03/device-apks/m1-03-extracted.apk \
            build/m1-03/device-apks/m1-03-direct.apk \
            fixtures/android/build/outputs/apk/androidTest/compatExtracted/debug/android-compatExtracted-debug-androidTest.apk \
            fixtures/android/build/outputs/apk/androidTest/compatDirect/debug/android-compatDirect-debug-androidTest.apk \
            fixtures/android/build/outputs/mapping/compatExtractedRelease/mapping.txt \
            fixtures/android/build/outputs/mapping/compatExtractedRelease/usage.txt \
            fixtures/android/build/outputs/mapping/compatDirectRelease/mapping.txt \
            fixtures/android/build/outputs/mapping/compatDirectRelease/usage.txt \
            fixtures/android/build/outputs/apk/classloaderPoc/release/android-classloaderPoc-release.apk \
            "$signer_digest" | tee build/m1-03/static-report.json

          export M005_ALT_KEYSTORE="$RUNNER_TEMP/m0-05-signing/alternate.p12"
          export M005_ALT_STORE_PASSWORD="$(openssl rand -hex 24)"
          export M005_ALT_KEY_ALIAS="alternate"
          export M005_ALT_KEY_PASSWORD="$M005_ALT_STORE_PASSWORD"
          echo "::add-mask::$M005_ALT_STORE_PASSWORD"
          echo "::add-mask::$M005_ALT_KEY_PASSWORD"
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$M005_ALT_KEYSTORE" \
            -storepass "$M005_ALT_STORE_PASSWORD" \
            -keypass "$M005_ALT_KEY_PASSWORD" \
            -alias "$M005_ALT_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=M0-05 Alternate Fixture,O=androidAppHardening,C=US"

          for variant in extracted direct; do
            root="build/m0-05/test-apks/$variant"
            unsigned_dir="$root/unsigned"
            signed_dir="$root/signed"
            # M1-03's transformed artifact intentionally names the production M2-01 Shell and
            # remains covered by the static gate above. The historical M0-05 runtime/negative
            # matrix must use its fixture-only Legacy Shell instead of feeding the obsolete PoC
            # container contract into the production M2-03 Guard.
            input_apk="fixtures/android/build/outputs/apk/compat${variant^}/release/android-compat${variant^}-release.apk"
            mkdir -p "$unsigned_dir" "$signed_dir"
            node tools/validation/create-m0-05-test-apks.mjs \
              "$input_apk" "$unsigned_dir" | tee "$root/creation-report.json"
            for unsigned_apk in "$unsigned_dir"/*.apk; do
              case "$unsigned_apk" in
                *config-duplicate*|*truncated-zip*) continue ;;
              esac
              output_name="$(basename "${unsigned_apk%-unsigned.apk}").apk"
              "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
                --v4-signing-enabled false \
                --ks "$M005_TEST_KEYSTORE" \
                --ks-key-alias "$M005_TEST_KEY_ALIAS" \
                --ks-pass env:M005_TEST_STORE_PASSWORD \
                --key-pass env:M005_TEST_KEY_PASSWORD \
                --out "$signed_dir/$output_name" \
                "$unsigned_apk"
            done
            duplicate_signer_digest="$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs \
              "$signed_dir/m0-05-native-duplicate.apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test "$duplicate_signer_digest" = "$signer_digest"

            signer_input="$unsigned_dir/m0-05-config-major-unsigned.apk"
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
              --v4-signing-enabled false \
              --ks "$M005_ALT_KEYSTORE" \
              --ks-key-alias "$M005_ALT_KEY_ALIAS" \
              --ks-pass env:M005_ALT_STORE_PASSWORD \
              --key-pass env:M005_ALT_KEY_PASSWORD \
              --out "$signed_dir/m0-05-wrong-signer.apk" \
              "$signer_input"
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
              --v4-signing-enabled false \
              --v3-signing-enabled false \
              --ks "$M005_TEST_KEYSTORE" \
              --ks-key-alias "$M005_TEST_KEY_ALIAS" \
              --ks-pass env:M005_TEST_STORE_PASSWORD \
              --key-pass env:M005_TEST_KEY_PASSWORD \
              --next-signer \
              --ks "$M005_ALT_KEYSTORE" \
              --ks-key-alias "$M005_ALT_KEY_ALIAS" \
              --ks-pass env:M005_ALT_STORE_PASSWORD \
              --key-pass env:M005_ALT_KEY_PASSWORD \
              --out "$signed_dir/m0-05-multi-signer.apk" \
              "$signer_input"

            jq -n --arg root "$root" '[
              {name:"config-major", apk:($root+"/signed/m0-05-config-major.apk"), expected_code:"AAH-P009"},
              {name:"config-reserved", apk:($root+"/signed/m0-05-config-reserved.apk"), expected_code:"AAH-P009"},
              {name:"config-signer-mismatch", apk:($root+"/signed/m0-05-config-signer-mismatch.apk"), expected_code:"AAH-P010"},
              {name:"config-factory-flags", apk:($root+"/signed/m0-05-config-factory-flags.apk"), expected_code:"AAH-P009"},
              {name:"config-invalid-utf8", apk:($root+"/signed/m0-05-config-invalid-utf8.apk"), expected_code:"AAH-P009"},
              {name:"config-nul", apk:($root+"/signed/m0-05-config-nul.apk"), expected_code:"AAH-P009"},
              {name:"config-slot-tail", apk:($root+"/signed/m0-05-config-slot-tail.apk"), expected_code:"AAH-P009"},
              {name:"config-deflate", apk:($root+"/signed/m0-05-config-deflate.apk"), expected_code:"AAH-P009", allow_install_rejection:true},
              {name:"config-descriptor", apk:($root+"/signed/m0-05-config-descriptor.apk"), expected_code:"AAH-P009", allow_install_rejection:true},
              {name:"config-crc", apk:($root+"/signed/m0-05-config-crc.apk"), expected_code:"AAH-P009", allow_install_rejection:true},
              {name:"config-length", apk:($root+"/signed/m0-05-config-length.apk"), expected_code:"AAH-P009", allow_install_rejection:true},
              {name:"payload-corrupt", apk:($root+"/signed/m0-05-payload-corrupt.apk"), expected_code:"AAH-P001"},
              {name:"native-duplicate", apk:($root+"/signed/m0-05-native-duplicate.apk"), expected_code:"AAH-P004", allow_install_rejection:true},
              {name:"wrong-signer", apk:($root+"/signed/m0-05-wrong-signer.apk"), expected_code:"AAH-P008"},
              {name:"multi-signer", apk:($root+"/signed/m0-05-multi-signer.apk"), expected_code:"AAH-P007"},
              {name:"duplicate-config", apk:($root+"/unsigned/m0-05-config-duplicate-unsigned.apk"), expected_code:"PLATFORM_ZIP_REJECTION", install_rejection:true},
              {name:"truncated-zip", apk:($root+"/unsigned/m0-05-truncated-zip-unsigned.apk"), expected_code:"PLATFORM_ZIP_REJECTION", install_rejection:true},
              {name:"unsigned", apk:($root+"/unsigned/m0-05-no-factory-unsigned.apk"), expected_code:"PLATFORM_SIGNATURE_REJECTION", install_rejection:true}
            ]' > "$root/startup-negative-cases.json"
          done

          rotation_lineage="$RUNNER_TEMP/m0-05-signing/fixture-to-alternate.lineage"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" rotate \
            --out "$rotation_lineage" \
            --old-signer \
            --ks "$M005_TEST_KEYSTORE" \
            --ks-key-alias "$M005_TEST_KEY_ALIAS" \
            --ks-pass env:M005_TEST_STORE_PASSWORD \
            --key-pass env:M005_TEST_KEY_PASSWORD \
            --new-signer \
            --ks "$M005_ALT_KEYSTORE" \
            --ks-key-alias "$M005_ALT_KEY_ALIAS" \
            --ks-pass env:M005_ALT_STORE_PASSWORD \
            --key-pass env:M005_ALT_KEY_PASSWORD
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --v4-signing-enabled false \
            --rotation-min-sdk-version 29 \
            --ks "$M005_TEST_KEYSTORE" \
            --ks-key-alias "$M005_TEST_KEY_ALIAS" \
            --ks-pass env:M005_TEST_STORE_PASSWORD \
            --key-pass env:M005_TEST_KEY_PASSWORD \
            --next-signer \
            --ks "$M005_ALT_KEYSTORE" \
            --ks-key-alias "$M005_ALT_KEY_ALIAS" \
            --ks-pass env:M005_ALT_STORE_PASSWORD \
            --key-pass env:M005_ALT_KEY_PASSWORD \
            --lineage "$rotation_lineage" \
            --out build/m0-05/test-apks/extracted/signed/m2-03-valid-rotation.apk \
            build/m0-05/test-apks/extracted/unsigned/m0-05-config-major-unsigned.apk
          ./gradlew --no-daemon --console=plain \
            :fixtures:android:assembleM201ExtractedRelease \
            :fixtures:android:assembleM201DirectRelease \
            :fixtures:android:assembleM201ExtractedDebugAndroidTest \
            :fixtures:android:assembleM201DirectDebugAndroidTest \
            :fixtures:android:assembleM202ExtractedRelease \
            :fixtures:android:assembleM202DirectRelease \
            :fixtures:android:assembleM202ExtractedDebugAndroidTest \
            :fixtures:android:assembleM202DirectDebugAndroidTest \
            :fixtures:android:assembleM203ExtractedRelease \
            :fixtures:android:assembleM203DirectRelease \
            :fixtures:android:assembleM203ExtractedDebugAndroidTest \
            :fixtures:android:assembleM203DirectDebugAndroidTest
          mkdir -p build/m2-02
          node tools/validation/prepare-m2-02-device-fixture.mjs extract \
            fixtures/android/build/generated/m0-05/compatExtractedRelease/assets/ah/runtime/payload.ahdc \
            build/m2-02/source-dex \
            | tee build/m2-02/source-dex-report.json
          mkdir -p build/m2-01
          for variant in extracted direct; do
            package_name="ah.fixtures.android.m201.${variant}"
            vector_root="build/m2-01/vector-${variant}"
            baseline="fixtures/android/build/outputs/apk/m201${variant^}/release/android-m201${variant^}-release.apk"
            ./gradlew --no-daemon --console=plain :host:container:prepareM202DeviceVector \
              "-Pm202PrimaryDex=$PWD/build/m2-02/source-dex/classes.dex" \
              "-Pm202SecondaryDex=$PWD/build/m2-02/source-dex/classes2.dex" \
              "-Pm202VectorOutput=$PWD/$vector_root" \
              "-Pm202PackageName=$package_name" \
              "-Pm202SignerSha256=$signer_digest" \
              "-Pm202OriginalFactory=ah.fixtures.android.payload.OriginalAppComponentFactory"
            node tools/validation/prepare-m2-02-device-fixture.mjs package \
              "$baseline" "$vector_root" "build/m2-01/m2-01-${variant}.apk" \
              | tee "build/m2-01/${variant}-package-report.json"
          done
          no_factory_root="build/m2-01/vector-no-factory"
          ./gradlew --no-daemon --console=plain :host:container:prepareM202DeviceVector \
            "-Pm202PrimaryDex=$PWD/build/m2-02/source-dex/classes.dex" \
            "-Pm202SecondaryDex=$PWD/build/m2-02/source-dex/classes2.dex" \
            "-Pm202VectorOutput=$PWD/$no_factory_root" \
            "-Pm202PackageName=ah.fixtures.android.m201.extracted" \
            "-Pm202SignerSha256=$signer_digest" \
            "-Pm202OriginalFactory=-"
          node tools/validation/prepare-m2-02-device-fixture.mjs package \
            fixtures/android/build/outputs/apk/m201Extracted/release/android-m201Extracted-release.apk \
            "$no_factory_root" build/m2-01/m2-01-no-factory.apk \
            | tee build/m2-01/no-factory-package-report.json
          for variant in extracted direct; do
            package_name="ah.fixtures.android.m202.${variant}"
            vector_root="build/m2-02/vector-${variant}"
            baseline="fixtures/android/build/outputs/apk/m202${variant^}/release/android-m202${variant^}-release.apk"
            ./gradlew --no-daemon --console=plain :host:container:prepareM202DeviceVector \
              "-Pm202PrimaryDex=$PWD/build/m2-02/source-dex/classes.dex" \
              "-Pm202SecondaryDex=$PWD/build/m2-02/source-dex/classes2.dex" \
              "-Pm202VectorOutput=$PWD/$vector_root" \
              "-Pm202PackageName=$package_name" \
              "-Pm202SignerSha256=$signer_digest"
            node tools/validation/prepare-m2-02-device-fixture.mjs package \
              "$baseline" "$vector_root" "build/m2-02/m2-02-${variant}.apk" \
              | tee "build/m2-02/${variant}-package-report.json"
          done
          mkdir -p build/m2-03
          for variant in extracted direct; do
            package_name="ah.fixtures.android.m203.${variant}"
            vector_root="build/m2-03/vector-${variant}"
            baseline="fixtures/android/build/outputs/apk/m203${variant^}/release/android-m203${variant^}-release.apk"
            ./gradlew --no-daemon --console=plain :host:container:prepareM202DeviceVector \
              "-Pm202PrimaryDex=$PWD/build/m2-02/source-dex/classes.dex" \
              "-Pm202SecondaryDex=$PWD/build/m2-02/source-dex/classes2.dex" \
              "-Pm202VectorOutput=$PWD/$vector_root" \
              "-Pm202PackageName=$package_name" \
              "-Pm202SignerSha256=$signer_digest"
            node tools/validation/prepare-m2-02-device-fixture.mjs package \
              "$baseline" "$vector_root" "build/m2-03/m2-03-${variant}.apk" \
              | tee "build/m2-03/${variant}-package-report.json"
          done
          mkdir -p build/m2-03/tamper-unsigned build/m2-03/tamper-signed
          node tools/validation/create-m0-05-test-apks.mjs \
            build/m2-03/m2-03-extracted.apk build/m2-03/tamper-unsigned \
            | tee build/m2-03/tamper-creation-report.json
          for name in config-major config-factory-flags config-slot-tail payload-corrupt \
            payload-nonce payload-tag-first payload-tag-middle payload-tag-last \
            payload-ciphertext-first payload-ciphertext-middle payload-ciphertext-last; do
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
              --v4-signing-enabled false \
              --ks "$M005_TEST_KEYSTORE" \
              --ks-key-alias "$M005_TEST_KEY_ALIAS" \
              --ks-pass env:M005_TEST_STORE_PASSWORD \
              --key-pass env:M005_TEST_KEY_PASSWORD \
              --out "build/m2-03/tamper-signed/m2-03-${name}.apk" \
              "build/m2-03/tamper-unsigned/m0-05-${name}-unsigned.apk"
          done
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --v4-signing-enabled false \
            --alignment-preserved true \
            --ks "$M005_ALT_KEYSTORE" \
            --ks-key-alias "$M005_ALT_KEY_ALIAS" \
            --ks-pass env:M005_ALT_STORE_PASSWORD \
            --key-pass env:M005_ALT_KEY_PASSWORD \
            --out build/m2-03/m2-03-wrong-signer-extracted.apk \
            build/m2-03/m2-03-extracted-aligned.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --v4-signing-enabled false \
            --v3-signing-enabled false \
            --alignment-preserved true \
            --ks "$M005_TEST_KEYSTORE" \
            --ks-key-alias "$M005_TEST_KEY_ALIAS" \
            --ks-pass env:M005_TEST_STORE_PASSWORD \
            --key-pass env:M005_TEST_KEY_PASSWORD \
            --next-signer \
            --ks "$M005_ALT_KEYSTORE" \
            --ks-key-alias "$M005_ALT_KEY_ALIAS" \
            --ks-pass env:M005_ALT_STORE_PASSWORD \
            --key-pass env:M005_ALT_KEY_PASSWORD \
            --out build/m2-03/m2-03-multi-signer-extracted.apk \
            build/m2-03/m2-03-extracted-aligned.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --v4-signing-enabled false \
            --v1-signing-enabled false \
            --v2-signing-enabled false \
            --rotation-min-sdk-version 29 \
            --alignment-preserved true \
            --ks "$M005_ALT_KEYSTORE" \
            --ks-key-alias "$M005_ALT_KEY_ALIAS" \
            --ks-pass env:M005_ALT_STORE_PASSWORD \
            --key-pass env:M005_ALT_KEY_PASSWORD \
            --lineage "$rotation_lineage" \
            --out build/m2-03/m2-03-historical-only-extracted.apk \
            build/m2-03/m2-03-extracted-aligned.apk
          for apk in \
            build/m2-03/m2-03-wrong-signer-extracted.apk \
            build/m2-03/m2-03-multi-signer-extracted.apk \
            build/m2-03/m2-03-historical-only-extracted.apk; do
            "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 4096 "$apk"
          done

      - name: Run bounded device acceptance
        shell: bash
        env:
          API: ${{ matrix.api }}
        run: |
          set -euo pipefail
          avd_name="m0_05_api${API}_r${{ matrix.revision }}_x86_64"
          serial="emulator-5554"
          emulator_pid=""

          cleanup() {
            set +e
            for package_name in \
              ah.fixtures.android.m301.java_single \
              ah.fixtures.android.m301.kotlin_single \
              ah.fixtures.android.m301.kotlin_multidex \
              ah.fixtures.android.m301.custom_application \
              ah.fixtures.android.m301.custom_factory \
              ah.fixtures.android.m301.startup_provider \
              ah.fixtures.android.m301.multi_process \
              ah.fixtures.android.m301.jni_four \
              ah.fixtures.android.m301.jni_arm; do
              adb -s "$serial" uninstall "$package_name" >/dev/null 2>&1
            done
            adb -s "$serial" uninstall ah.fixtures.android.m005.extracted.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m005.extracted >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m005.direct.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m005.direct >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m202.extracted.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m202.extracted >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m202.direct.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m202.direct >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m203.extracted.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m203.extracted >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m203.direct.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m203.direct >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m201.extracted.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m201.extracted >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m201.direct.test >/dev/null 2>&1
            adb -s "$serial" uninstall ah.fixtures.android.m201.direct >/dev/null 2>&1
            adb -s "$serial" shell run-as ah.runtime.policy.test rm -f \
              files/m2-03-process.apk >/dev/null 2>&1
            adb -s "$serial" shell am clear-debug-app >/dev/null 2>&1
            adb -s "$serial" uninstall ah.runtime.policy.test >/dev/null 2>&1
            adb -s "$serial" shell rm -f /data/local/tmp/m2-03-process.apk >/dev/null 2>&1
            adb -s "$serial" emu kill >/dev/null 2>&1
            if [[ -n "$emulator_pid" ]]; then
              kill -TERM "$emulator_pid" >/dev/null 2>&1
              pkill -TERM -P "$emulator_pid" >/dev/null 2>&1
              timeout 10s tail --pid="$emulator_pid" -f /dev/null >/dev/null 2>&1
              kill -KILL "$emulator_pid" >/dev/null 2>&1
              pkill -KILL -P "$emulator_pid" >/dev/null 2>&1
            fi
            pkill -TERM -f "$ANDROID_HOME/emulator/qemu/" >/dev/null 2>&1
            sleep 1
            pkill -KILL -f "$ANDROID_HOME/emulator/qemu/" >/dev/null 2>&1
            rm -rf -- "$RUNNER_TEMP/m0-05-signing"
          }
          trap cleanup EXIT INT TERM

          avd_dir="$ANDROID_AVD_HOME/$avd_name.avd"
          mkdir -p "$avd_dir" "build/m0-05/device-api${API}-x86_64"
          printf '%s\n' \
            'avd.ini.encoding=UTF-8' \
            "path=$avd_dir" \
            "target=android-$API" \
            > "$ANDROID_AVD_HOME/$avd_name.ini"
          printf '%s\n' \
            'PlayStore.enabled=no' \
            'abi.type=x86_64' \
            "avd.id=$avd_name" \
            'avd.ini.encoding=UTF-8' \
            "avd.name=$avd_name" \
            'disk.dataPartition.size=2147483648' \
            'fastboot.forceColdBoot=yes' \
            'fastboot.forceFastBoot=no' \
            'hw.cpu.arch=x86_64' \
            'hw.cpu.ncore=2' \
            'hw.device.name=pixel_2' \
            'hw.gpu.enabled=yes' \
            'hw.keyboard=yes' \
            'hw.lcd.density=420' \
            'hw.lcd.height=1920' \
            'hw.lcd.width=1080' \
            'hw.ramSize=2048' \
            "image.sysdir.1=system-images/android-$API/default/x86_64/" \
            'runtime.network.latency=none' \
            'runtime.network.speed=full' \
            'tag.id=default' \
            > "$avd_dir/config.ini"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" \
            -avd "$avd_name" -port 5554 -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on -no-metrics \
            >"build/m0-05/device-api${API}-x86_64/emulator.stdout.txt" \
            2>"build/m0-05/device-api${API}-x86_64/emulator.stderr.txt" &
          emulator_pid=$!

          timeout 180s adb -s "$serial" wait-for-device
          timeout 180s bash -c \
            'until [[ "$(adb -s "$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]]; do sleep 2; done' \
            _ "$serial"
          adb -s "$serial" shell input keyevent 82

          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}" = "chore/m3-01-android-fixtures" ]]; then
            ANDROID_SERIAL="$serial" timeout 1200s ./gradlew --no-daemon --console=plain \
              :integration-tests:runFixtureMatrix
            cat integration-tests/build/reports/fixture-results.json
            exit 0
          fi

          ANDROID_SERIAL="$serial" timeout 300s ./gradlew --no-daemon --console=plain \
            :runtime:native:connectedCheck \
            :runtime:bootstrap:connectedCheck \
            :runtime:policy:connectedCheck

          mkdir -p "build/m2-04/device-api${API}-x86_64/x86_64"
          cp -R runtime/native/build/outputs/androidTest-results/connected/. \
            "build/m2-04/device-api${API}-x86_64/x86_64/"

          adb -s "$serial" install -r -t --no-streaming \
            runtime/policy/build/outputs/apk/androidTest/debug/policy-debug-androidTest.apk
          mkdir -p "build/m2-05/device-api${API}-x86_64"
          risk_output="$(timeout 60s adb -s "$serial" shell am instrument -w \
            ah.runtime.policy.test/ah.runtime.guard.PolicyConnectedRunner)"
          printf '%s\n' "$risk_output" \
            | tee "build/m2-05/device-api${API}-x86_64/policy.instrumentation.txt"
          grep -F 'policy_connected_smoke=true cases=11 risk_connected=true version=1' \
            <<<"$risk_output"
          grep -F 'INSTRUMENTATION_CODE: -1' <<<"$risk_output"
          risk_max_us="$(sed -n 's/.*max_us=\([0-9][0-9]*\).*/\1/p' \
            <<<"$risk_output" | head -n1)"
          test -n "$risk_max_us"
          test "$risk_max_us" -le 50000
          printf '{"task_id":"M2-05","api":%s,"abi":"x86_64","evaluations":1000,"max_us":%s,"budget_us":50000,"result":"PASS"}\n' \
            "$API" "$risk_max_us" \
            > "build/m2-05/device-api${API}-x86_64/report.json"
          jdwp_instrumentation="build/m2-05/device-api${API}-x86_64/policy-jdwp.instrumentation.txt"
          jdwp_client="build/m2-05/device-api${API}-x86_64/jdb.txt"
          adb -s "$serial" shell am force-stop ah.runtime.policy.test
          adb -s "$serial" shell am set-debug-app -w ah.runtime.policy.test
          timeout --kill-after=5s 45s adb -s "$serial" shell am instrument -w \
            -e m205_wait_for_debugger true \
            ah.runtime.policy.test/ah.runtime.guard.PolicyConnectedRunner \
            >"$jdwp_instrumentation" 2>&1 &
          instrumentation_pid=$!
          jdwp_pid=''
          jdwp_pid_seen=false
          jdwp_forward_ready=false
          timeout --kill-after=1s 3s adb -s "$serial" forward --remove tcp:8700 \
            >/dev/null 2>&1 || true
          for _ in $(seq 1 30); do
            candidate="$(timeout --kill-after=1s 2s adb -s "$serial" shell \
              pidof -s ah.runtime.policy.test 2>/dev/null | tr -d '\r' || true)"
            if [[ "$candidate" =~ ^[0-9]+$ ]]; then
              jdwp_pid_seen=true
              if timeout --kill-after=1s 2s adb -s "$serial" forward \
                tcp:8700 "jdwp:$candidate" >/dev/null 2>&1; then
                jdwp_pid="$candidate"
                jdwp_forward_ready=true
                break
              fi
            fi
            sleep 0.1
          done
          printf 'pid_seen=%s forward_ready=%s\n' "$jdwp_pid_seen" \
            "$jdwp_forward_ready" \
            > "build/m2-05/device-api${API}-x86_64/jdwp-probe.txt"
          test -n "$jdwp_pid"
          ( { sleep 5; printf 'exit\n' 2>/dev/null || true; } | timeout --kill-after=5s 20s \
              jdb -attach localhost:8700 >"$jdwp_client" 2>&1 || true ) &
          jdb_pid=$!
          for _ in $(seq 1 550); do
            if ! kill -0 "$instrumentation_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if kill -0 "$instrumentation_pid" 2>/dev/null; then
            kill -TERM "$instrumentation_pid" 2>/dev/null || true
            sleep 1
            kill -KILL "$instrumentation_pid" 2>/dev/null || true
            wait "$instrumentation_pid" || true
            false
          fi
          wait "$instrumentation_pid"
          wait "$jdb_pid" || true
          timeout --kill-after=1s 3s adb -s "$serial" forward --remove tcp:8700
          adb -s "$serial" shell am clear-debug-app
          grep -F 'policy_jdwp=true risk_connected=true version=1' "$jdwp_instrumentation"
          grep -F 'jdwp=detected' "$jdwp_instrumentation"
          grep -F 'INSTRUMENTATION_CODE: -1' "$jdwp_instrumentation"
          if [[ "${GITHUB_HEAD_REF:-}" = "feat/m2-05-environment-risk-engine" ]]; then
            timeout 300s node tools/validation/run-m2-02-device-acceptance.mjs \
              --task-id M2-05 \
              --adb "$ANDROID_HOME/platform-tools/adb" \
              --serial "$serial" \
              --platform "api${API}-x86_64-linux-kvm-release-r8" \
              --cold-starts 1 \
              --command-timeout-ms 60000 \
              --extracted-target-apk build/m2-03/m2-03-extracted.apk \
              --extracted-test-apk fixtures/android/build/outputs/apk/androidTest/m203Extracted/debug/android-m203Extracted-debug-androidTest.apk \
              --extracted-vector-report build/m2-03/vector-extracted/vector-report.json \
              --direct-target-apk build/m2-03/m2-03-direct.apk \
              --direct-test-apk fixtures/android/build/outputs/apk/androidTest/m203Direct/debug/android-m203Direct-debug-androidTest.apk \
              --direct-vector-report build/m2-03/vector-direct/vector-report.json \
              --evidence "build/m2-05/device-api${API}-x86_64/release-r8"
            grep -R -F 'risk_r8_jni=true' \
              "build/m2-05/device-api${API}-x86_64/release-r8"
            if [[ "$API" = "29" ]]; then
              ANDROID_SERIAL="$serial" timeout 300s ./gradlew --no-daemon --console=plain \
                -Pm204TargetAbi=x86 :runtime:policy:connectedCheck
              mkdir -p "build/m2-05/device-api${API}-x86_64/x86"
              cp -R runtime/policy/build/outputs/androidTest-results/connected/. \
                "build/m2-05/device-api${API}-x86_64/x86/"
              adb -s "$serial" install -r -t --no-streaming \
                runtime/policy/build/outputs/apk/androidTest/debug/policy-debug-androidTest.apk
              x86_risk_output="$(timeout 60s adb -s "$serial" shell am instrument -w \
                ah.runtime.policy.test/ah.runtime.guard.PolicyConnectedRunner)"
              printf '%s\n' "$x86_risk_output" \
                | tee "build/m2-05/device-api${API}-x86_64/x86/policy.instrumentation.txt"
              grep -F 'native_mapping_score=80 timeout_unavailable=true' <<<"$x86_risk_output"
              grep -F 'INSTRUMENTATION_CODE: -1' <<<"$x86_risk_output"
            fi
            exit 0
          fi
          adb -s "$serial" push build/m0-05/test-apks/extracted/signed/m0-05-config-major.apk \
            /data/local/tmp/m2-03-process.apk
          policy_root="$(adb -s "$serial" shell run-as ah.runtime.policy.test pwd | tr -d '\r')"
          test "${policy_root#/data/}" != "$policy_root"
          adb -s "$serial" shell run-as ah.runtime.policy.test mkdir -p files
          adb -s "$serial" shell run-as ah.runtime.policy.test cp \
            /data/local/tmp/m2-03-process.apk files/m2-03-process.apk
          policy_output="$(timeout 60s adb -s "$serial" shell am instrument -w \
            -e verify_process_apk "$policy_root/files/m2-03-process.apk" \
            -e verify_process_package ah.fixtures.android.m005.extracted \
            ah.runtime.policy.test/ah.runtime.guard.PolicyConnectedRunner)"
          printf '%s\n' "$policy_output"
          grep -F 'policy_connected=true cases=15' <<<"$policy_output"
          grep -F 'primary_cache_hit=true secondary_cache_hit=true' <<<"$policy_output"
          grep -F 'INSTRUMENTATION_CODE: -1' <<<"$policy_output"
          policy_signer_prefix="$(sed -n 's/.*signer_prefix=\([0-9a-f]\{12\}\).*/\1/p' <<<"$policy_output" | head -n1)"
          policy_pid_one="$(sed -n 's/.*primary_pid=\([0-9][0-9]*\).*/\1/p' <<<"$policy_output" | head -n1)"
          policy_pid_two="$(sed -n 's/.*secondary_pid=\([0-9][0-9]*\).*/\1/p' <<<"$policy_output" | head -n1)"
          test "${#policy_signer_prefix}" = 12
          test -n "$policy_pid_one"
          test -n "$policy_pid_two"
          test "$policy_pid_one" != "$policy_pid_two"
          adb -s "$serial" shell run-as ah.runtime.policy.test rm -f files/m2-03-process.apk
          if adb -s "$serial" shell run-as ah.runtime.policy.test ls files/m2-03-process.apk; then
            echo "M2-03 private process APK cleanup failed" >&2
            exit 1
          fi
          adb -s "$serial" shell rm -f /data/local/tmp/m2-03-process.apk
          if adb -s "$serial" shell ls /data/local/tmp/m2-03-process.apk; then
            echo "M2-03 staging process APK cleanup failed" >&2
            exit 1
          fi
          timeout 300s node tools/validation/run-m2-03-signer-matrix.mjs \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial "$serial" \
            --policy-apk runtime/policy/build/outputs/apk/androidTest/debug/policy-debug-androidTest.apk \
            --signer-sha256 "$(cat "$RUNNER_TEMP/m0-05-signing/signer-sha256.txt")" \
            --same-apk build/m0-05/test-apks/extracted/signed/m0-05-config-major.apk \
            --wrong-apk build/m0-05/test-apks/extracted/signed/m0-05-wrong-signer.apk \
            --multi-apk build/m0-05/test-apks/extracted/signed/m0-05-multi-signer.apk \
            --unsigned-apk build/m0-05/test-apks/extracted/unsigned/m0-05-config-major-unsigned.apk \
            --rotation-apk build/m0-05/test-apks/extracted/signed/m2-03-valid-rotation.apk \
            --wrong-target-apk build/m2-03/m2-03-wrong-signer-extracted.apk \
            --multi-target-apk build/m2-03/m2-03-multi-signer-extracted.apk \
            --historical-target-apk build/m2-03/m2-03-historical-only-extracted.apk \
            --config-target-apk build/m2-03/tamper-signed/m2-03-config-major.apk \
            --factory-target-apk build/m2-03/tamper-signed/m2-03-config-factory-flags.apk \
            --binding-target-apk build/m2-03/tamper-signed/m2-03-config-slot-tail.apk \
            --container-target-apk build/m2-03/tamper-signed/m2-03-payload-corrupt.apk \
            --m302-nonce-target-apk build/m2-03/tamper-signed/m2-03-payload-nonce.apk \
            --m302-tag-first-target-apk build/m2-03/tamper-signed/m2-03-payload-tag-first.apk \
            --m302-tag-middle-target-apk build/m2-03/tamper-signed/m2-03-payload-tag-middle.apk \
            --m302-tag-last-target-apk build/m2-03/tamper-signed/m2-03-payload-tag-last.apk \
            --m302-ciphertext-first-target-apk build/m2-03/tamper-signed/m2-03-payload-ciphertext-first.apk \
            --m302-ciphertext-middle-target-apk build/m2-03/tamper-signed/m2-03-payload-ciphertext-middle.apk \
            --m302-ciphertext-last-target-apk build/m2-03/tamper-signed/m2-03-payload-ciphertext-last.apk \
            --evidence "build/m2-03/device-api${API}-x86_64/signer-matrix" \
            --command-timeout-ms 60000

          timeout 900s node tools/validation/run-m0-05-device-acceptance.mjs \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial "$serial" \
            --platform "api${API}-x86_64-linux-kvm" \
            --cold-starts 20 \
            --command-timeout-ms 60000 \
            --extracted-target-apk fixtures/android/build/outputs/apk/compatExtracted/release/android-compatExtracted-release.apk \
            --direct-target-apk fixtures/android/build/outputs/apk/compatDirect/release/android-compatDirect-release.apk \
            --no-factory-apk build/m0-05/test-apks/extracted/signed/m0-05-no-factory.apk \
            --extracted-negative-signed-dir build/m0-05/test-apks/extracted/signed \
            --extracted-negative-unsigned-dir build/m0-05/test-apks/extracted/unsigned \
            --direct-negative-signed-dir build/m0-05/test-apks/direct/signed \
            --direct-negative-unsigned-dir build/m0-05/test-apks/direct/unsigned \
            --evidence "build/m0-05/device-api${API}-x86_64"
          timeout 300s node tools/validation/run-m0-05-startup-negative.mjs \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial "$serial" \
            --package ah.fixtures.android.m005.extracted \
            --cases build/m0-05/test-apks/extracted/startup-negative-cases.json \
            --evidence "build/m0-05/device-api${API}-x86_64/startup-negative-extracted" \
            --command-timeout-ms 60000
          timeout 300s node tools/validation/run-m0-05-startup-negative.mjs \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial "$serial" \
            --package ah.fixtures.android.m005.direct \
            --cases build/m0-05/test-apks/direct/startup-negative-cases.json \
            --evidence "build/m0-05/device-api${API}-x86_64/startup-negative-direct" \
            --command-timeout-ms 60000
          cat "build/m0-05/device-api${API}-x86_64/report.json"
          cat "build/m0-05/device-api${API}-x86_64/startup-negative-extracted/startup-negative-report.json"
          cat "build/m0-05/device-api${API}-x86_64/startup-negative-direct/startup-negative-report.json"

          timeout 300s node tools/validation/run-m2-01-device-acceptance.mjs \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial "$serial" \
            --platform "api${API}-x86_64-linux-kvm" \
            --command-timeout-ms 60000 \
            --extracted-target-apk build/m2-01/m2-01-extracted.apk \
            --extracted-test-apk fixtures/android/build/outputs/apk/androidTest/m201Extracted/debug/android-m201Extracted-debug-androidTest.apk \
            --extracted-vector-report build/m2-01/vector-extracted/vector-report.json \
            --direct-target-apk build/m2-01/m2-01-direct.apk \
            --direct-test-apk fixtures/android/build/outputs/apk/androidTest/m201Direct/debug/android-m201Direct-debug-androidTest.apk \
            --direct-vector-report build/m2-01/vector-direct/vector-report.json \
            --no-factory-target-apk build/m2-01/m2-01-no-factory.apk \
            --no-factory-test-apk fixtures/android/build/outputs/apk/androidTest/m201Extracted/debug/android-m201Extracted-debug-androidTest.apk \
            --no-factory-vector-report build/m2-01/vector-no-factory/vector-report.json \
            --evidence "build/m2-01/device-api${API}-x86_64"
          cat "build/m2-01/device-api${API}-x86_64/report.json"

          timeout 1200s node tools/validation/run-m2-02-device-acceptance.mjs \
            --task-id M2-06 \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial "$serial" \
            --platform "api${API}-x86_64-linux-kvm" \
            --cold-starts 20 \
            --command-timeout-ms 60000 \
            --extracted-target-apk build/m2-02/m2-02-extracted.apk \
            --extracted-test-apk fixtures/android/build/outputs/apk/androidTest/m202Extracted/debug/android-m202Extracted-debug-androidTest.apk \
            --extracted-vector-report build/m2-02/vector-extracted/vector-report.json \
            --direct-target-apk build/m2-02/m2-02-direct.apk \
            --direct-test-apk fixtures/android/build/outputs/apk/androidTest/m202Direct/debug/android-m202Direct-debug-androidTest.apk \
            --direct-vector-report build/m2-02/vector-direct/vector-report.json \
            --evidence "build/m2-06/device-api${API}-x86_64"
          cat "build/m2-06/device-api${API}-x86_64/report.json"

          m204_signing_env="$RUNNER_TEMP/m0-05-signing/m2-04.env"
          test -f "$m204_signing_env"
          source "$m204_signing_env"
          m204_abis=(x86_64)
          if [[ "$API" = "29" ]]; then m204_abis+=(x86); fi
          for abi in "${m204_abis[@]}"; do
            runtime_root="build/m2-04/device-api${API}-x86_64/${abi}/runtime"
            evidence_root="build/m2-04/device-api${API}-x86_64/${abi}/evidence"
            mkdir -p "$runtime_root" "$evidence_root"
            ./gradlew --no-daemon --console=plain -Pm204TargetAbi="$abi" \
              :fixtures:android:assembleM202ExtractedRelease \
              :fixtures:android:assembleM202DirectRelease \
              :fixtures:android:assembleM202ExtractedDebugAndroidTest \
              :fixtures:android:assembleM202DirectDebugAndroidTest
            cp fixtures/android/build/outputs/apk/androidTest/m202Extracted/debug/android-m202Extracted-debug-androidTest.apk \
              "$runtime_root/m2-04-extracted-test.apk"
            cp fixtures/android/build/outputs/apk/androidTest/m202Direct/debug/android-m202Direct-debug-androidTest.apk \
              "$runtime_root/m2-04-direct-test.apk"
            for variant in extracted direct; do
              baseline="fixtures/android/build/outputs/apk/m202${variant^}/release/android-m202${variant^}-release.apk"
              node tools/validation/prepare-m2-02-device-fixture.mjs package \
                "$baseline" "build/m2-02/vector-${variant}" \
                "$runtime_root/m2-04-${variant}.apk" \
                | tee "$runtime_root/${variant}-package-report.json"
            done
            timeout 300s node tools/validation/run-m2-02-device-acceptance.mjs \
              --task-id M2-04 \
              --expected-abi "$abi" \
              --adb "$ANDROID_HOME/platform-tools/adb" \
              --serial "$serial" \
              --platform "api${API}-${abi}-linux-kvm" \
              --cold-starts 1 \
              --command-timeout-ms 60000 \
              --extracted-target-apk "$runtime_root/m2-04-extracted.apk" \
              --extracted-test-apk "$runtime_root/m2-04-extracted-test.apk" \
              --extracted-vector-report build/m2-02/vector-extracted/vector-report.json \
              --direct-target-apk "$runtime_root/m2-04-direct.apk" \
              --direct-test-apk "$runtime_root/m2-04-direct-test.apk" \
              --direct-vector-report build/m2-02/vector-direct/vector-report.json \
              --evidence "$evidence_root"
            cat "$evidence_root/report.json"
          done
          unset M005_TEST_KEYSTORE M005_TEST_STORE_PASSWORD M005_TEST_KEY_ALIAS M005_TEST_KEY_PASSWORD
          rm -f -- "$m204_signing_env"

          timeout 1200s node tools/validation/run-m2-02-device-acceptance.mjs \
            --task-id M2-03 \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial "$serial" \
            --platform "api${API}-x86_64-linux-kvm" \
            --cold-starts 20 \
            --command-timeout-ms 60000 \
            --extracted-target-apk build/m2-03/m2-03-extracted.apk \
            --extracted-test-apk fixtures/android/build/outputs/apk/androidTest/m203Extracted/debug/android-m203Extracted-debug-androidTest.apk \
            --extracted-vector-report build/m2-03/vector-extracted/vector-report.json \
            --direct-target-apk build/m2-03/m2-03-direct.apk \
            --direct-test-apk fixtures/android/build/outputs/apk/androidTest/m203Direct/debug/android-m203Direct-debug-androidTest.apk \
            --direct-vector-report build/m2-03/vector-direct/vector-report.json \
            --evidence "build/m2-03/device-api${API}-x86_64"
          cat "build/m2-03/device-api${API}-x86_64/report.json"
          node tools/validation/summarize-m3-02-device-tamper.mjs \
            tools/validation/src/tamper/resources/catalog.yaml \
            "build/m2-03/device-api${API}-x86_64/signer-matrix/signer-matrix-report.json" \
            "build/m2-02/device-api${API}-x86_64/report.json" \
            "build/m2-03/device-api${API}-x86_64/report.json" \
            "api${API}-x86_64-linux-kvm" \
            "build/m3-02/device-api${API}-x86_64/fuzz-summary.json"

      - name: Print cleanup diagnostics
        if: always()
        shell: bash
        run: |
          adb devices -l || true
          ps -ef | grep -E '[e]mulator|[q]emu-system' || true
          find build/m0-05 -maxdepth 2 -type f -print -exec sha256sum {} \; || true
          find build/m2-01 -maxdepth 2 -type f -print -exec sha256sum {} \; || true
          find build/m2-02 -maxdepth 2 -type f -print -exec sha256sum {} \; || true
          find build/m2-03 -maxdepth 2 -type f -print -exec sha256sum {} \; || true
          find build/m2-04 -maxdepth 4 -type f -print -exec sha256sum {} \; || true
          find build/m2-05 -maxdepth 5 -type f -print -exec sha256sum {} \; || true
          find build/m2-06 -maxdepth 3 -type f -print -exec sha256sum {} \; || true
          find build/m3-02 -maxdepth 3 -type f -print -exec sha256sum {} \; || true
          find integration-tests/build/reports -maxdepth 1 -type f -print -exec sha256sum {} \; || true

      - name: Upload bounded validation evidence
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0-05-api-${{ matrix.api }}-x86_64-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/m1-03/**/*.json
            build/m0-05/*.json
            build/m0-05/*.txt
            build/m0-05/test-apks/**/*.json
            build/m0-05/device-api${{ matrix.api }}-x86_64/**/*.json
            integration-tests/build/reports/fixture-results.json
            build/m0-05/device-api${{ matrix.api }}-x86_64/**/*.txt
            build/m0-05/device-api${{ matrix.api }}-x86_64/**/*.xml
            build/m2-04/device-api${{ matrix.api }}-x86_64/**/*
            build/m2-05/device-api${{ matrix.api }}-x86_64/**/*
            build/m2-06/device-api${{ matrix.api }}-x86_64/**/*
            build/m3-02/device-api${{ matrix.api }}-x86_64/**/*
            build/m2-01/**/*.json
            build/m2-01/**/*.txt
            build/m2-02/**/*.json
            build/m2-02/**/*.txt
            build/m2-03/**/*.json
            build/m2-03/**/*.txt
            fixtures/android/build/outputs/mapping/compatExtractedRelease/mapping.txt
            fixtures/android/build/outputs/mapping/compatExtractedRelease/usage.txt
            fixtures/android/build/outputs/mapping/compatDirectRelease/mapping.txt
            fixtures/android/build/outputs/mapping/compatDirectRelease/usage.txt
            fixtures/android/build/outputs/mapping/m201ExtractedRelease/mapping.txt
            fixtures/android/build/outputs/mapping/m201ExtractedRelease/usage.txt
            fixtures/android/build/outputs/mapping/m201DirectRelease/mapping.txt
            fixtures/android/build/outputs/mapping/m201DirectRelease/usage.txt
